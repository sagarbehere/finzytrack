[[capability]]
id = "CAP-WS-RECOVER-FIRST"
area = "Setup and workspaces"
capability = "Every unfinished save in the app is undone before any workspace opens (at start and at each switch); one that cannot be undone keeps closed only the workspaces and copies that use a file it names, saying which workspace's save it is, until the user retries or chooses \"Keep the files as they are now\""
v04 = "new"
v04_note = "owner, 2026-10-27 (ADR-0063 decision 2): the recovery rule, approved with \"Yes, write both into the hand-off and give me the prompt\"; it replaced an earlier rule after the S0045 verifier's round 2 (ADR-0063). Each journal names its files by canonical path, fixed when it is written (ADR-0012 amendment); refusal `RECOVERY_BLOCKED {path, workspace, reason}`, also for the journal's own workspace and its folder opened by Locate or \"Open folder…\"; the way out is \"Keep the files as they are now\" (drops the journal, writes nothing to the ledger files, logged; owner: \"Yes, I agree with the keep the files as they are now way out.\"); forget keeps the journal; a journal that cannot be read blocks every open and copy. Sharing a file between two workspaces stays unsupported and unchecked, and is harmless under this rule. (INV-32)"
status = "planned"
milestone = "M2"
release_blocking = "yes"
doc = "—"
legacy_entry = "—"
demo = "no"
backlog = ["BL-0103"]
adrs = ["ADR-0063", "ADR-0012"]
code = []
tests = []
