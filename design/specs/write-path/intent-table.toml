# The per-mutator intended-change table (S0004; prose and column meanings: README.md in this folder).
# Source of truth for design/specs/write-path/intent-table.md (GENERATED by scripts/gen_intent_table.py).
#
# Columns per [[mutator]]:
#   id          stable id of the v0.4 mutator (use case)            caps     capability rows it serves
#   kind        clearance kind (ADR-0014): add | change-one | many  old      v0.3 endpoint, or "n/a"
#   edits       edit primitives (ADR-0009): insert, replace, delete, replace_token, insert_meta, delete_meta, option_line, new_file
#   files       which files the edits may touch
#   intent      the exact intended change contract step 2 checks (everything else must be identical)
#   meta        metadata keys the app writes (ADR-0026 §4.1 list or §4.2 user vocabulary entered by the user)
#   ack         error keys the user may be asked to acknowledge (contract step 3): "<Beancount error class> on <entry>"
#   refuses     conditions that refuse the write before planning (codes from ARCHITECTURE.md §6 where they exist)
#   oracle      expected v0.3 divergence classes when compared with the old app (S0002 harness), or "none: no old endpoint"
#   status      decided (an accepted ADR settles every column) | draft (confirm in the vertical's first slice) | owner:<inbox file>
#   milestone   where the mutator is built                         adrs     ADRs it implements

# The 26 legacy mutators (`@_serialized_write` in the legacy LedgerManager, review:D1 §5) and where each went.
[legacy]
mutators = [
  "append_entries", "write_price_directives", "edit_price_directives", "open_deposit", "import_statement",
  "undo_statement_import", "create_account_directive", "update_account_directive", "close_account_directive",
  "reopen_account_directive", "delete_account_directive", "delete_account", "create_budget_directive",
  "update_budget_directive", "delete_budget_directive", "upsert_commodity_metadata", "set_operating_currencies",
  "create_document_attachment", "delete_document_directive", "ensure_documents_option", "update_transactions_by_id",
  "delete_transactions_by_id", "delete_transactions_for_account", "add_balance_directive", "update_balance_directive",
  "delete_balance_directive",
]

[legacy.map]
append_entries = ["import.commit", "inv.add-holding", "inv.buy", "inv.reinvest", "inv.dividend", "inv.sell", "inv.conversion", "inv.cd-maturity", "inv.interest"]
write_price_directives = ["price.write"]
edit_price_directives = ["price.edit"]
open_deposit = ["inv.open-deposit"]
import_statement = ["not built: ADR-0030 (statement import is cut; one-upload sync replaces it)"]
undo_statement_import = ["not built: ADR-0030 (its undo goes with it; D1 undo journal covers v0.4 writes)"]
create_account_directive = ["account.create"]
update_account_directive = ["account.edit", "account.rename"]
close_account_directive = ["account.close"]
reopen_account_directive = ["account.reopen"]
delete_account_directive = ["account.delete-with-transactions"]
delete_account = ["account.delete-with-transactions", "not built: ADR-0049 (delete_transactions=false removed the account but left its postings, a broken ledger; v0.4 offers reassign instead)"]
create_budget_directive = ["budget.create"]
update_budget_directive = ["budget.edit"]
delete_budget_directive = ["budget.delete"]
upsert_commodity_metadata = ["inv.commodity-metadata"]
set_operating_currencies = ["settings.operating-currencies"]
create_document_attachment = ["doc.account-attach"]
delete_document_directive = ["doc.account-detach"]
ensure_documents_option = ["doc.documents-option"]
update_transactions_by_id = ["txn.edit", "txn.bulk-edit"]
delete_transactions_by_id = ["txn.delete"]
delete_transactions_for_account = ["account.delete-with-transactions"]
add_balance_directive = ["balance.add"]
update_balance_directive = ["balance.edit"]
delete_balance_directive = ["balance.delete"]

# ---------------------------------------------------------------- workspace and setup (M2–M3)

[[mutator]]
id = "ws.create-ledger"
caps = ["CAP-SETUP-FRESH", "CAP-SETUP-CURRENCY"]
kind = "many"
old = "POST /api/setup/complete"
edits = ["new_file"]
files = "a new root file (and starter includes) in the new workspace folder; never an existing file"
intent = "the new files equal the starter template with `option \"operating_currency\"` set to the chosen currency; nothing else exists before"
meta = []
ack = []
refuses = ["a ledger file already exists at the path (INV-29: never created implicitly, never overwritten)"]
oracle = ["M28 (if the legacy starter template carries machinery keys); the v0.3 wizard also writes `option \"operating_currency\"` (ADR-0052), so the currency is not a divergence"]
status = "draft"
milestone = "M3"
adrs = ["ADR-0008", "ADR-0052", "ADR-0019"]

[[mutator]]
id = "ws.seed-demo"
caps = ["CAP-DATA-DEMO-GEN"]
kind = "many"
old = "n/a"
edits = ["new_file"]
files = "the demo workspace folder only (INV-25: `kind: demo` and the realpath of the app's demo path)"
intent = "the demo files equal the generator's output for the build anchor"
meta = []
ack = []
refuses = ["the target is not the app's demo path, or is a symlink (INV-25)"]
oracle = ["none: no old endpoint (the legacy seeds a bundled file, not through a write path)"]
status = "decided"
milestone = "M3"
adrs = ["ADR-0008", "ADR-0022"]

# ---------------------------------------------------------------- accounts (M4)

[[mutator]]
id = "account.create"
caps = ["CAP-ACCT-CREATE"]
kind = "add"
old = "POST /api/accounts"
edits = ["insert"]
files = "the routed insert file (Fava `insert-entry` options, else the root)"
intent = "one `open` added: the user's date, account name, currencies, booking method if chosen, and the vocabulary keys the user filled in"
meta = ["account_number", "ofx-bank-id", "ifsc_code", "swift_bic", "description", "display-name", "account-type", "interest-rate", "maturity-date", "interest-account", "income-type", "dividend-of"]
ack = []
refuses = ["the account is already open", "the name breaks the ledger's account grammar (custom root names allowed)", "the name was not typed or picked by the user (INV-15)"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)", "M28 (snake_case vocabulary)"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0009", "ADR-0026", "ADR-0031"]

[[mutator]]
id = "account.edit"
caps = ["CAP-ACCT-EDIT"]
kind = "change-one"
old = "PUT /api/accounts/{name} (without new_name)"
edits = ["replace", "insert_meta", "delete_meta"]
files = "the file holding the account's `open` (and its `close`, for a close-date edit)"
intent = "the `open` (or `close`) replaced by the same entry with exactly the requested metadata set/removed, currencies, open date or booking method; untouched keys keep their value and type"
meta = ["the vocabulary keys of account.create"]
ack = []
refuses = ["a new open date after the account's first posting (ValidationError would follow)", "currencies that existing postings violate", "a booking-method change without the re-booking preview confirmed (ADR-0031)"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)", "FIX-L3-15 (legacy stringifies typed metadata)"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0009", "ADR-0026", "ADR-0031"]

[[mutator]]
id = "account.rename"
caps = ["CAP-ACCT-RENAME"]
kind = "many"
old = "PUT /api/accounts/{name} with new_name"
edits = ["replace_token", "delete_meta", "insert_meta", "replace"]
files = "every file of the set with a reference to the account"
intent = "A and every subaccount `A:…` become B and `B:…` (ADR-0049 amendment): every account token naming one of them (postings, `open`, `close`, `balance`, `pad` both accounts, `note`, `document`, account-typed `custom` values), and every metadata value on any entry and every `custom` string value that is exactly one of those account names; text that merely contains a name is untouched. Nothing else changes. No renamed name may already exist (that is a merge)"
meta = []
ack = []
refuses = ["a target name already exists (use account.merge)", "a target name breaks the account grammar", "an encrypted file references a renamed account (not editable, ADR-0009)"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0049", "ADR-0009"]

[[mutator]]
id = "account.merge"
caps = ["CAP-ACCT-MERGE"]
kind = "many"
old = "n/a"
edits = ["replace_token", "delete"]
files = "every file of the set with a posting, `note`, `document`, `pad` or `balance` naming A"
intent = "move_postings(A → B): every posting of A, A's `note` and `document` directives, and every `pad` whose source is A re-pointed to B; a transaction with legs on both keeps two B postings; A's own `balance` and `pad` directives and A's `custom \"budget\"` directives dropped (listed in the preview); A's `open` and `close` stay, leaving an empty A (ADR-0049 and its amendment)"
meta = []
ack = ["BalanceError on a `balance` assertion of B that newly fails (listed in the preview)"]
refuses = ["B is not open over the whole date span of A's postings", "B's currency constraints reject a moved posting", "holdings at cost and A and B book differently (warning plus refusal until confirmed)", "A has subaccounts (ADR-0049)"]
oracle = ["none: no old endpoint"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0049", "ADR-0009"]

[[mutator]]
id = "account.delete-reassign"
caps = ["CAP-ACCT-DELETE"]
kind = "many"
old = "n/a (the legacy delete cannot reassign)"
edits = ["replace_token", "delete"]
files = "every file of the set with an entry of A"
intent = "account.merge into B (postings, notes, documents and `pad` sources re-pointed to B), then A's `open`, `close`, `balance` and `pad` removed and A's `custom \"budget\"` directives dropped"
meta = []
ack = ["BalanceError on a `balance` assertion of B that newly fails (listed in the preview)"]
refuses = ["the account.merge refusals", "A has subaccounts (ADR-0049)"]
oracle = ["none: no old endpoint"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0049"]

[[mutator]]
id = "account.delete-with-transactions"
caps = ["CAP-ACCT-DELETE"]
kind = "many"
old = "DELETE /api/accounts/{name} (delete_transactions=true, the default)"
edits = ["delete"]
files = "every file of the set with an entry touching A"
intent = "every transaction with a leg on A removed (every leg), every `pad` whose source is A removed, and all of A's directives removed: `open`, `close`, `balance`, `pad`, `note`, `document`, `custom \"budget\"`. An account with no transactions is the same intent with no transactions"
meta = []
ack = ["BalanceError on a `balance` assertion of another account whose balance changes, including accounts padded from A (each listed in the all-time preview)"]
refuses = ["A has subaccounts (ADR-0049)", "the user has not chosen between Move and Delete (the question has no default)"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)", "FIX-I1 (legacy keeps A's balance, pad, note and budget directives)", "FIX-I11 (legacy lets the new errors through)"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0049", "ADR-0008"]

[[mutator]]
id = "account.close"
caps = ["CAP-ACCT-CLOSE"]
kind = "add"
old = "POST /api/accounts/{name}/close"
edits = ["insert"]
files = "the routed insert file"
intent = "one `close` for A at the chosen date, with `reason` if the user gave one"
meta = ["reason"]
ack = []
refuses = ["the close date is before the open date", "A has postings after the close date (ValidationError would follow)", "A is already closed"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0009", "ADR-0026"]

[[mutator]]
id = "account.reopen"
caps = ["CAP-ACCT-CLOSE"]
kind = "change-one"
old = "POST /api/accounts/{name}/reopen"
edits = ["delete"]
files = "the file holding A's `close`"
intent = "A's one `close` removed"
meta = []
ack = []
refuses = ["A is not closed"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0009"]

[[mutator]]
id = "balance.add"
caps = ["CAP-ACCT-ASSERTIONS"]
kind = "many"
old = "POST /api/accounts/{name}/balance-directives"
edits = ["insert"]
files = "the routed insert file"
intent = "one `balance` for the account, date, amount and currency; with the pad option, also one `pad` dated the day before from the chosen source account"
meta = []
ack = ["BalanceError on the inserted assertion (the user records a balance that does not match yet)", "PadError on the inserted `pad` (unused because the balance already matches)"]
refuses = ["the account is not open on the date", "the pad source account is not open on the pad date"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0009", "ADR-0008"]

[[mutator]]
id = "balance.edit"
caps = ["CAP-ACCT-ASSERTIONS"]
kind = "many"
old = "PUT /api/accounts/{name}/balance-directives"
edits = ["replace", "insert", "delete"]
files = "the file holding the assertion (and its paired `pad`)"
intent = "the one targeted `balance` replaced with the new date, amount or currency; its paired `pad` added, moved or removed as asked"
meta = []
ack = ["BalanceError on the edited assertion", "PadError on its paired `pad`"]
refuses = ["the targeted assertion is not found by (account, date, currency, amount) exactly once"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0009"]

[[mutator]]
id = "balance.delete"
caps = ["CAP-ACCT-ASSERTIONS"]
kind = "many"
old = "DELETE /api/accounts/{name}/balance-directives"
edits = ["delete"]
files = "the file holding the assertion (and its paired `pad`)"
intent = "the one targeted `balance` removed, and its paired `pad` when asked"
meta = []
ack = ["PadError on a paired `pad` the user chose to keep"]
refuses = ["the targeted assertion is not found exactly once"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0009"]

[[mutator]]
id = "doc.account-attach"
caps = ["CAP-DOC-ACCOUNT"]
kind = "add"
old = "POST /api/documents/account"
edits = ["insert"]
files = "the routed insert file (the file goes into the documents folder first)"
intent = "one `document` directive for the account, date and stored file path (relative to the documents root)"
meta = []
ack = []
refuses = ["the documents root cannot be resolved (doc.documents-option first)", "the path leaves the documents root"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0009"]

[[mutator]]
id = "doc.account-detach"
caps = ["CAP-DOC-ACCOUNT"]
kind = "change-one"
old = "DELETE /api/documents/account"
edits = ["delete"]
files = "the file holding the `document` directive"
intent = "the one targeted `document` directive removed (the stored file is left for the orphan scan)"
meta = []
ack = []
refuses = ["the directive is generated by the documents plugin rather than written in a file (not targetable, ADR-0009)"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)"]
status = "decided"
milestone = "M4"
adrs = ["ADR-0009"]

[[mutator]]
id = "doc.documents-option"
caps = ["CAP-DOC-LOCATION"]
kind = "add"
old = "internal (ensure_documents_option, before the first document write)"
edits = ["option_line"]
files = "the root file"
intent = "one `option \"documents\"` line added to the root; written on first use only, never on open (INV-30)"
meta = []
ack = []
refuses = ["the ledger already declares a documents option"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)"]
status = "decided"
milestone = "M3"
adrs = ["ADR-0009", "ADR-0017"]

# ---------------------------------------------------------------- transactions (M5)

[[mutator]]
id = "txn.edit"
caps = ["CAP-TXN-INLINE-EDIT", "CAP-TXN-SAVE", "CAP-TXN-METADATA"]
kind = "change-one"
old = "PUT /api/ledger/transactions (one transaction)"
edits = ["replace"]
files = "the file holding the targeted entry"
intent = "the entry addressed by (TransactionId, entry_hash) replaced by the request merged against the parsed source entry: `@@`, lot dates and labels, elided amounts and metadata types kept where the user did not change them; nothing else changes"
meta = ["memo", "document*", "note", "user keys typed in the drawer"]
ack = ["BalanceError on a `balance` assertion of an account whose postings changed (amount, date or account)"]
refuses = ["entry_hash mismatch (the entry changed since it was read)", "the entry is plugin-generated or in an encrypted file", "the edit does not balance or leaves an inactive account (ValidationError)", "a booking error on a reduction (BookingError, ReductionError, AmbiguousMatchError): never acknowledgeable", "the edit removes or changes a read-forever identity key (`id`, `transaction_id`, `import-key`, `external_id`, `external_id_type`, `ofx_id`, `source_account`): only the consented cleanup may (INV-21 c, INV-14)"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)", "FIX-L3-02 (legacy refuses priced and cost edits; drops lot dates and labels)", "FIX-L3-05 (legacy rewrites the written scale)", "FIX-L3-15 (legacy stringifies typed metadata)", "M28", "non-comparable: entries without a legacy `id`"]
status = "decided"
milestone = "M5"
adrs = ["ADR-0009", "ADR-0026", "ADR-0008"]

[[mutator]]
id = "txn.bulk-edit"
caps = ["CAP-TXN-BULK"]
kind = "many"
old = "PUT /api/ledger/transactions (several transactions)"
edits = ["replace", "replace_token"]
files = "every file holding a selected entry"
intent = "each selected entry replaced as in txn.edit with the one bulk change applied (account, tag, link, flag, payee, narration, or metadata set/remove/rename); unselected entries identical"
meta = ["as txn.edit"]
ack = ["as txn.edit, for every affected account"]
refuses = ["as txn.edit, for any selected entry (the whole write is refused), including a metadata rename or removal that touches a read-forever identity key"]
oracle = ["as txn.edit"]
status = "decided"
milestone = "M5"
adrs = ["ADR-0009", "ADR-0026"]

[[mutator]]
id = "txn.delete"
caps = ["CAP-TXN-DELETE"]
kind = "change-one"
old = "DELETE /api/ledger/transactions"
edits = ["delete"]
files = "the file holding the targeted entry"
intent = "exactly the entries addressed by (TransactionId, entry_hash) removed (one entry; several are txn.delete-many)"
meta = []
ack = ["BalanceError on a `balance` assertion of an account whose balance changes"]
refuses = ["entry_hash mismatch", "a plugin-generated target"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)", "non-comparable: entries without a legacy `id`"]
status = "decided"
milestone = "M5"
adrs = ["ADR-0009", "ADR-0026"]

[[mutator]]
id = "doc.txn-attach"
caps = ["CAP-DOC-TXN"]
kind = "change-one"
old = "POST /api/documents/upload, then PUT /api/ledger/transactions with the `document` key"
edits = ["insert_meta"]
files = "the file holding the transaction (the file goes into the documents folder first)"
intent = "one `document` metadata line (or the next free `documentN`) added to the transaction, holding the stored path; nothing else in the entry changes"
meta = ["document*"]
ack = []
refuses = ["entry_hash mismatch", "the path leaves the documents root"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)", "FIX-L3-15"]
status = "draft"
milestone = "M5"
adrs = ["ADR-0009", "ADR-0026"]

# ---------------------------------------------------------------- import and reconciliation (M6)

[[mutator]]
id = "import.commit"
caps = ["CAP-IMP-COMMIT", "CAP-IMP-BLANK"]
kind = "many"
old = "POST /api/import/commit"
edits = ["insert"]
files = "the routed insert file(s)"
intent = "one transaction per committed draft, built by the domain builders: the anchor posting carries `import-key`; nothing from client-supplied metadata; duplicates (re-matched at commit) are skipped and reported"
meta = ["import-key", "txn-date", "original", "statement-amount", "memo"]
ack = ["BalanceError on a `balance` assertion of the anchor account (\"Register anyway\")"]
refuses = ["a draft whose import-key element is already in the ledger, unless the user forced it (`~dup<n>`) (INV-14)", "an anchor account not open over the drafts' dates", "an open slot left empty (the draft is not complete)"]
oracle = ["I10", "I2 (glob includes)", "I3 (plugins)", "M28 (legacy writes id, content_hash, source_account)", "FIX-L3-02 (legacy rounds a `@@` total to its own unit price)", "FIX-L3-05 (legacy rewrites the written scale)"]
status = "decided"
milestone = "M6"
adrs = ["ADR-0027", "ADR-0026", "ADR-0009"]

[[mutator]]
id = "import.settle-pending"
caps = ["CAP-IMP-COMMIT"]
kind = "change-one"
old = "n/a"
edits = ["replace"]
files = "the file holding the pending entry"
intent = "the pending entry (flag `!`, every import-key element of kind `auth`) replaced by itself with the statement element appended to the anchor's `import-key` and the flag set to `*`; amounts unchanged (a difference goes to reconciliation)"
meta = ["import-key"]
ack = []
refuses = ["the entry is not pending by the derived rule (a user's own `!` is never settled)"]
oracle = ["none: no old endpoint"]
status = "decided"
milestone = "M6"
adrs = ["ADR-0026", "ADR-0027"]

[[mutator]]
id = "import.link-element"
caps = ["CAP-IMP-DEDUPE", "CAP-RECON-STATEMENT"]
kind = "change-one"
old = "n/a"
edits = ["delete_meta", "insert_meta"]
files = "the file holding the matched entry"
intent = "the anchor posting's `import-key` line replaced (delete + insert of that one meta line) by the same elements plus one appended (a transfer counterpart, a confirmed scored duplicate, or a reconciliation match); elements never reordered or recomputed"
meta = ["import-key"]
ack = []
refuses = ["the element is already present"]
oracle = ["none: no old endpoint"]
status = "decided"
milestone = "M6"
adrs = ["ADR-0026"]

[[mutator]]
id = "recon.proceed"
caps = ["CAP-RECON-STATEMENT"]
kind = "many"
old = "n/a"
edits = ["insert", "replace", "delete_meta", "insert_meta"]
files = "the routed insert file and the files of the matched entries"
intent = "the additions and amount fixes the user chose (as import.commit and txn.edit), the chosen match elements (as import.link-element), then one `balance` on the anchor account dated closing + 1"
meta = ["import-key", "txn-date", "original", "statement-amount", "memo"]
ack = []
refuses = ["the inserted assertion would fail (the report shows the residual instead)", "an unsettled pending entry falls on or before the as-of date (no assertion is proposed)"]
oracle = ["none: no old endpoint"]
status = "draft"
milestone = "M6"
adrs = ["ADR-0028", "ADR-0027", "ADR-0026"]

[[mutator]]
id = "import.bank-id-migration"
caps = ["CAP-IMP-OFX-DETECT"]
kind = "many"
old = "n/a"
edits = ["insert_meta"]
files = "the files holding the mapped accounts' `open` directives"
intent = "for each `ofx_mappings.yaml` entry the user consents to: `account_number` / `ofx-bank-id` added to the account's `open`; nothing else"
meta = ["account_number", "ofx-bank-id"]
ack = []
refuses = ["the mapped account is not open in this ledger", "the key is already present with a different value (listed, never overwritten)"]
oracle = ["none: no old endpoint"]
status = "draft"
milestone = "M6"
adrs = ["ADR-0027", "ADR-0026"]

