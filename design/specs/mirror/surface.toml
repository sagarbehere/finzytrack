# The mirror surface: every table and column the v0.4 mirror has at M1a (S0021).
# Edit this file, then run `python3 scripts/gen_mirror_surface.py`; the check is scripts/check_mirror_surface.py.
# Field meanings, conventions (money, dates, JSON, ids, as-of) and rules: README.md beside this file.
#
# Per table: name (public name: the r_<name> view, and for v0.2.2 tables the compatibility view), base (the
# internal table, always m_<name>), row (what one row is), as_of, origin, status, cites, note, column.
# Per column: name, type, format, meaning, source, sign, origin, change, cites, why, user_sql, status.

surface_version = 1

# ─────────────────────────────────────────────────────────────────────────────────────────────── postings
[[table]]
name = "postings"
base = "m_postings"
row = "One posting of a transaction in the loaded ledger, after plugins and booking (so padding transactions and plugin-made transactions are included), in entry order."
as_of = "entry"
origin = "v0.2.2"
status = "decided"
cites = ["ADR-0015", "ADR-0048"]
note = "The planning columns the write contract needs (the entry's source location and entry_hash, review:D1 §10, review:28 §4.1) are added by M1b's slice through this spec."

[[table.column]]
name = "posting_id"
type = "INTEGER"
format = "ordinal"
meaning = "Position of the posting in the load, counting from 1. Not a stable identity: it changes when entries are added or removed earlier in the ledger."
source = "Build counter over transactions in Beancount's entry order (date, directive type, source line), postings in written order."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "transaction_id"
type = "TEXT"
format = "id"
meaning = "The transaction's TransactionId, the same for every posting of the entry."
source = "README 'Ids': the legacy `id` meta, else the legacy `transaction_id` meta, else `k:` plus the entry's first `import-key` element, else the content fallback hash with an ordinal for repeats."
sign = "n/a"
origin = "v0.2.2"
change = "changed"
cites = ["ADR-0026", "INV-21"]
why = "Entries v0.4 writes carry no `id`, so their id is `k:` plus their import key. On a ledger v0.2.2 wrote (no `import-key`), every id is the same as in v0.2.2."
user_sql = true
status = "decided"

[[table.column]]
name = "transaction_content_hash"
type = "TEXT"
format = "hash"
meaning = "A SHA-256 hash of the transaction's content (date, payee, narration, originating amount and account), computed from the entry."
source = "README 'Ids': the v0.2.2 content-hash formula applied to the loaded entry, without the repeat ordinal. Never read from the ledger's `content_hash` key."
sign = "n/a"
origin = "v0.2.2"
change = "changed"
cites = ["ADR-0055"]
why = "v0.2.2 copied the stored `content_hash` key, which was stale after edits and NULL when absent; v0.4 computes it for every transaction. Nothing in the app reads it; it may be dropped after 0.4.x."
user_sql = true
status = "draft"

