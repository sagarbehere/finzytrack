status = "decided"

[[table.column]]
name = "is_currency"
type = "INTEGER"
format = "bool"
meaning = "1 when the commodity is cash (a unit of account), 0 when it is a holding such as a stock or fund."
source = "First rule that applies: a declared `asset-class` decides (1 for `cash` or `currency`, compared trimmed and case-insensitive; 0 otherwise); else 1 for an ISO 4217 currency code or a code listed in `operating_currency`; else 0."
sign = "n/a"
origin = "v0.2.2"
change = "changed"
cites = ["ADR-0025", "L3-13"]
why = "v0.2.2 used `operating_currency` as the list of currencies, so in an INR ledger a USD bank account counted as a holding (0); v0.4 counts USD as cash (1). A code with no `asset-class` that is neither an ISO code nor an operating currency (for example an undeclared `VTI`) was 1 in v0.2.2 and is 0 now; a non-ISO operating currency such as `RMB` stays 1 (ADR-0025 amendment, 2026-10-25). This is ADR-0025's one-time reclassification."
user_sql = true
status = "decided"

