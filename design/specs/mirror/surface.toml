# ─────────────────────────────────────────────────────────────────────────────────────────────── ledger_errors
[[table]]
name = "ledger_errors"
base = "m_ledger_errors"
row = "One error of the load: parser, booking, validation and plugin errors alike (not only parsing errors)."
as_of = "load"
origin = "v0.2.2"
status = "decided"
cites = ["ADR-0048", "ADR-0008"]
note = "The write contract's baseline error set (review:D1 §10, §12.1) is read from this table."

[[table.column]]
name = "id"
type = "INTEGER"
format = "ordinal"
meaning = "Position among the load's errors, counting from 1."
source = "Build counter in Beancount's error order."
