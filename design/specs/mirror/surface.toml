type = "TEXT"
format = "decimal"
meaning = "Number of units in the lot."
source = "Position units number."
sign = "Positive for a lot held; negative for a short position."
origin = "v0.2.2"
change = "changed"
cites = ["ADR-0023", "ADR-0038"]
why = "Same number, written in plain notation: v0.2.2 wrote `str(Decimal)`, which gives an exponent for some computed values (`1E-8`, `0E-8`, `1E+2`); v0.4 writes `0.00000001`, `0.00000000`, `100`. A query that casts the column gets the same value; one that compares the raw text may not."
user_sql = true
status = "decided"

[[table.column]]
name = "units_currency"
type = "TEXT"
format = "currency"
meaning = "The commodity held (`VTI`)."
source = "Position units currency."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "cost_number"
type = "TEXT"
format = "decimal"
meaning = "Cost per unit of the lot."
source = "Position cost number."
sign = "Per-unit cost, normally positive."
origin = "v0.2.2"
change = "changed"
cites = ["ADR-0023", "ADR-0038"]
why = "Same number, written in plain notation: v0.2.2 wrote `str(Decimal)`, which gives an exponent for some computed values (`1E-8`, `0E-8`, `1E+2`); v0.4 writes `0.00000001`, `0.00000000`, `100`. A query that casts the column gets the same value; one that compares the raw text may not."
user_sql = true
status = "decided"

[[table.column]]
name = "cost_currency"
type = "TEXT"
format = "currency"
meaning = "Currency of the cost."
source = "Position cost currency."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "acquisition_date"
type = "TEXT"
format = "date"
meaning = "The lot's date (when it was bought)."
source = "Position cost date (booking fills the purchase date when the cost spec gives none)."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "label"
type = "TEXT"
format = "text"
meaning = "The lot's label; NULL when it has none."
source = "Position cost label."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "book_value"
type = "TEXT"
format = "decimal"
meaning = "What the lot cost in total: `units_number` times `cost_number`, never rounded."
source = "Decimal product, computed as README 'Exact numbers' says (rounding fails the build)."
sign = "Same sign as `units_number`."
origin = "v0.2.2"
change = "changed"
cites = ["ADR-0023", "ADR-0038"]
why = "Same number, written in plain notation: v0.2.2 wrote `str(Decimal)`, which gives an exponent for some computed values (`1E-8`, `0E-8`, `1E+2`); v0.4 writes `0.00000001`, `0.00000000`, `100`. A query that casts the column gets the same value; one that compares the raw text may not."
user_sql = true
status = "decided"

