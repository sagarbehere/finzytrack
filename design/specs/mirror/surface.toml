origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "source_file"
type = "TEXT"
format = "path"
meaning = "File the error points at; NULL when Beancount gives none."
source = "Error source `filename`."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "line_number"
type = "INTEGER"
format = "int"
meaning = "Line the error points at (0 when Beancount gives a file but no line); NULL when it gives none."
source = "Error source `lineno`."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "message"
type = "TEXT"
format = "text"
meaning = "Beancount's error message."
source = "Error message."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "entry_json"
type = "TEXT"
format = "json-entry"
meaning = "The entry the error is about, as a JSON array of its fields in Beancount's order (meta first, then date, ...); NULL when the error has no entry."
source = "Error entry, converted by README 'Metadata JSON'."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "error_type"
type = "TEXT"
format = "text"
meaning = "The error's Beancount class name (`BalanceError`, `ValidationError`, ...)."
source = "Error class name."
sign = "n/a"
origin = "v0.4"
change = "new"
cites = ["ADR-0008"]
why = "An error key is the error class plus the entry it is attached to (review:D1 §12.1); the class was not stored before."
user_sql = true
status = "decided"

# ─────────────────────────────────────────────────────────────────────────────────────────────── training_data
[[table]]
name = "training_data"
base = "m_training_data"
row = "One transaction that has a payee and an Income or Expenses posting: its description and that posting's account."
as_of = "ledger-end"
origin = "v0.2.2"
status = "decided"
cites = ["ADR-0048"]
note = "Kept for compatibility; v0.4's categorization learns from the ledger in its own way (ADR-0027)."

[[table.column]]
name = "id"
type = "INTEGER"
format = "ordinal"
meaning = "Position in the table, counting from 1."
source = "Build counter in entry order."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "description"
type = "TEXT"
format = "text"
meaning = "Payee, then `memo` metadata (or the legacy `ofx_memo`) when present, then narration, joined by spaces."
source = "Entry payee, meta and narration."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = []
why = ""
user_sql = true
status = "decided"

[[table.column]]
name = "category"
type = "TEXT"
format = "account"
meaning = "The account of the transaction's first Income or Expenses posting."
source = "First posting (in posting order) whose account kind is Income or Expenses."
sign = "n/a"
origin = "v0.2.2"
change = "changed"
cites = ["ADR-0024"]
why = "v0.2.2 matched the literal prefixes `Income:` and `Expenses:`; v0.4 uses the account kind, so ledgers with custom root names get rows too. Default-root ledgers are unchanged."
user_sql = true
status = "decided"

# ─────────────────────────────────────────────────────────────────────────────────────────────── meta
[[table]]
name = "meta"
base = "m_meta"
row = "One fact about this mirror file (key and value), for the app and its freshness check."
as_of = "load"
origin = "v0.2.2"
status = "draft"
cites = ["ADR-0015"]
note = "Internal in v0.2.2 too (not in its user docs, not on ADR-0048's list); its name is still served. v0.4 keys: `surface_version`, `ledger_version`, `fingerprint`, `export_version` (a hash of this DDL), `built_at`, `build_complete` (always `1`: only complete generations are published). v0.2.2's `ledger_files` key is replaced by `fingerprint`."

[[table.column]]
name = "key"
type = "TEXT"
format = "text"
meaning = "The fact's name."
source = "Written by the mirror build."
sign = "n/a"
origin = "v0.2.2"
change = "changed"
cites = ["ADR-0015"]
why = "The set of keys differs (see the table note)."
user_sql = false
status = "draft"

[[table.column]]
name = "value"
type = "TEXT"
format = "text"
meaning = "The fact's value, as text (JSON for structured values)."
source = "Written by the mirror build."
sign = "n/a"
origin = "v0.2.2"
change = "changed"
cites = ["ADR-0015"]
why = "Values follow the v0.4 keys."
user_sql = false
status = "draft"

# ─────────────────────────────────────────────────────────────────────────────────────────────── compatibility functions
[[compat_function]]
name = "budget_for_range"
served_by = "The `ledger` step's budget measures (`budget_status`): nesting-aware totals and income sign-normalized (CAP-FN-BUDGET-FOR-RANGE)."
message = "`budget_for_range` is deprecated and is removed after 0.4.x. Use the `ledger` step's budget measure instead."
located = "The notice names the dashboard, widget and step that called it."
milestone = "M7"
cites = ["ADR-0048", "CAP-FN-BUDGET-FOR-RANGE"]
status = "draft"

# ─────────────────────────────────────────────────────────────────────────────────────────────── dropped
[[dropped]]
item = "table:latest_prices"
origin = "v0.3.0"
reason = "v0.3.0 only, never released, so it needs no compatibility; it also included future-dated prices. `price_asof(base, quote, date)` replaces it (M7)."
cites = ["ADR-0048", "ADR-0016", "CAP-QUERY-SURFACE", "L3-12"]

[[dropped]]
item = "function:cash_instruments"
origin = "v0.3.0"
reason = "v0.3.0 only; deposits and their interest become `ledger` step measures."
cites = ["ADR-0048", "ADR-0030"]

[[dropped]]
item = "function:portfolio_returns"
origin = "v0.3.0"
reason = "v0.3.0 only; XIRR and TWR returns are cut."
cites = ["ADR-0048", "ADR-0030", "CAP-INV-XIRR", "CAP-INV-TWR"]

[[dropped]]
item = "function:portfolio_series"
origin = "v0.3.0"
reason = "v0.3.0 only; value over time comes from the `ledger` step's value measure."
cites = ["ADR-0048", "ADR-0029", "ADR-0030"]

