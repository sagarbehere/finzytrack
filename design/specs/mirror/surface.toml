type = "TEXT"
format = "account"
meaning = "The account the transaction came from (usually the bank or card); for an entry with neither key, v0.2.2's per-row answer (the other leg of a two-leg entry). NULL when it cannot be told."
source = "Per row, first rule that applies: the legacy `source_account` meta whenever the key is present, its value as written, even empty (every row); else the account of the first leg (in posting order) that carries an `import-key` (every row); else, in a two-leg entry, the other leg's account; else the first Assets or Liabilities leg other than this row (v0.2.2's literal `Assets:`/`Liabilities:` prefixes, as `_compute_source_account` at the v0.2.2 tag); else NULL."
sign = "n/a"
origin = "v0.2.2"
change = "same"
cites = ["ADR-0055", "INV-21", "ADR-0026"]
why = "Every entry already in a ledger shows what v0.2.2 showed: v0.2.2 imports carried the key, v0.4 imports mark the same leg with `import-key`, and entries with neither key keep v0.2.2's per-row rules (ADR-0055 amendment, 2026-10-25)."
user_sql = true
status = "decided"

