# T2 (design/process/PROCESS.md §6): the packaged build on three OSes with --smoke-test (S0012; ADR-0007, ADR-0056).
# Deterministic only: no AI, no agent runs, no secrets. Started by hand (directly or through nightly.yml), before each
# release and after packaging changes (ADR-0060).
# Each OS builds its own artifacts (shell/package_app.py), installs them as a user would where it can, runs the
# smoke test (spec: shell/src-tauri/src/smoke.rs: the page, the bundled interpreter and a real handshake and ping with
# the bundled ledger engine, S0038), and runs it again with the engine's site-packages moved away and with the bundled
# runtime moved away, each of which must fail with its own reason (the must-not-pass cases, EP-29). A fixme OS's
# first smoke run must fail with exactly its known reason instead (matrix known_failure); no job hides its result.
# The job's timeout-minutes is a hang backstop only, far above a normal build, not a budget (owner rule, S0034;
# S0036). The 12-minute step limits bound one fixed smoke run each, which does not grow with the code.
name: packaged
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to build (empty: the triggering commit)"
        type: string
        default: ""
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packaged-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # known_failure: empty, the OS is strict. Otherwise the OS is fixme due M11 (ADR-0061 decision 4b) and its
          # first smoke run passes only when it fails with exactly this reason (smoke_packaged.py --expect-fail): a
          # different failure, a failure in any other run or step, and an unexpected pass fail the run (S0114; owner,
          # 2026-11-13: "Narrow it (Recommended)"). Remove the reason with its row.
          - os: macos-15  # Apple silicon; macOS 14 is the minimum (ADR-0007 amendment)
            known_failure: ""
          # Strict since S0114 fixed the build check's path false positive (BL-0264 closes when a run shows it green).
          - os: windows-2022
            known_failure: ""
          # fixme due M11, BL-0263: the AppImage's bundled engine (owner, 2026-11-13: "Defer to M11 (Recommended)").
          - os: ubuntu-22.04  # the oldest supported Ubuntu, so the glibc baseline is 22.04 (ARCHITECTURE.md §5)
            known_failure: "the bundled engine failed: engine view: CalledProcessError"
    runs-on: ${{ matrix.os }}
    env:
      KNOWN_FAILURE: ${{ matrix.known_failure }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Frontend environment (also provides the pinned Tauri CLI)
        run: npm install -g pnpm@12.12.0 && pnpm --dir frontend install --frozen-lockfile
      - name: System libraries for Tauri bundling on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev file libfuse2 xvfb
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: cd shell/src-tauri && (rustup show active-toolchain || rustup toolchain install)
      - name: Build the package
        run: python shell/package_app.py --list artifacts.txt
      - name: macOS — signature and smoke test
        timeout-minutes: 12
        if: runner.os == 'macOS'
        run: |
          app="$(grep '\.app$' artifacts.txt)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q '^Signature=adhoc$'
          known=()
          if [ -n "$KNOWN_FAILURE" ]; then known=(--expect-fail "$KNOWN_FAILURE"); fi
          python shell/smoke_packaged.py "$app" "${known[@]}"
          ditto "$app" "$RUNNER_TEMP/neg-engine.app"
          mv "$RUNNER_TEMP/neg-engine.app/Contents/Resources/sidecar/engine" "$RUNNER_TEMP/engine-away"
          python shell/smoke_packaged.py "$RUNNER_TEMP/neg-engine.app" --expect-fail "the bundled engine failed"
          ditto "$app" "$RUNNER_TEMP/neg.app"
          mv "$RUNNER_TEMP/neg.app/Contents/Resources/sidecar/python" "$RUNNER_TEMP/python-away"
          python shell/smoke_packaged.py "$RUNNER_TEMP/neg.app" --expect-fail "cannot start the bundled interpreter"
      - name: Windows — silent per-user install and smoke test
        timeout-minutes: 12
        if: runner.os == 'Windows'
        run: |
          installer="$(grep -- '-setup\.exe$' artifacts.txt)"
          # MSYS_NO_PATHCONV: Git Bash would turn /S into a drive path, and NSIS would wait in its wizard
          MSYS_NO_PATHCONV=1 timeout 300 "$installer" /S
          dir="$LOCALAPPDATA/Finzytrack"
          exe="$(find "$dir" -maxdepth 1 -iname '*.exe' ! -iname 'uninstall*.exe')"
          test "$(printf '%s\n' "$exe" | wc -l)" -eq 1
          known=()
          if [ -n "$KNOWN_FAILURE" ]; then known=(--expect-fail "$KNOWN_FAILURE"); fi
          python shell/smoke_packaged.py "$exe" "${known[@]}"
          mv "$dir/sidecar/engine" "$RUNNER_TEMP/engine-away"
          python shell/smoke_packaged.py "$exe" --expect-fail "the bundled engine failed"
          mv "$RUNNER_TEMP/engine-away" "$dir/sidecar/engine"
          mv "$dir/sidecar/python" "$RUNNER_TEMP/python-away"
          python shell/smoke_packaged.py "$exe" --expect-fail "cannot start the bundled interpreter"
      - name: Linux — AppImage (FUSE-mounted, read-only, as users run it), then the .deb installed, smoke tests
        timeout-minutes: 12
        if: runner.os == 'Linux'
        run: |
          appimage="$(grep '\.AppImage$' artifacts.txt)"
          chmod +x "$appimage"
          known=()
          if [ -n "$KNOWN_FAILURE" ]; then known=(--expect-fail "$KNOWN_FAILURE"); fi
          xvfb-run -a python shell/smoke_packaged.py "$appimage" "${known[@]}"
          deb="$(grep '\.deb$' artifacts.txt)"
          sudo apt-get install -y "$deb"
          exe="$(dpkg -L finzytrack | grep '^/usr/bin/' | head -n 1)"
          xvfb-run -a python shell/smoke_packaged.py "$exe"
          engine_dir="$(dpkg -L finzytrack | grep '/sidecar/engine$')"
          sudo mv "$engine_dir" "$RUNNER_TEMP/engine-away"
          xvfb-run -a python shell/smoke_packaged.py "$exe" --expect-fail "the bundled engine failed"
          sudo mv "$RUNNER_TEMP/engine-away" "$engine_dir"
          python_dir="$(dpkg -L finzytrack | grep '/sidecar/python$')"
          sudo mv "$python_dir" "$RUNNER_TEMP/python-away"
          xvfb-run -a python shell/smoke_packaged.py "$exe" --expect-fail "cannot start the bundled interpreter"
      - name: Diagnosis — the bundled engine's own error output off macOS, when a step failed (S0112; prints only)
        if: failure() && runner.os != 'macOS'
        run: |
          py=""
          for c in build/sidecar/python/bin/python3.13 build/sidecar/python/python.exe; do if [ -f "$c" ]; then py="$c"; fi; done
          case "$py" in *python.exe) site="$(dirname "$(dirname "$py")")/engine/site-packages";; *bin/python3.13) site="$(dirname "$(dirname "$(dirname "$py")")")/engine/site-packages";; esac
          echo "engine site: $site"
          echo "interpreter: $py"
          "$py" -s -S -B -P -c "import site, sys; site.addsitedir(sys.argv.pop(1)); print(sys.path)" "$site" || true
          "$py" -s -S -B -P -c "import site, sys; site.addsitedir(sys.argv.pop(1)); import ledger_engine.protocol.server; print('engine imports')" "$site" || true
          "$py" -c "import site, sys; print(sys.prefix, site.getsitepackages())" || true
      - name: Keep the artifacts for a week
        uses: actions/upload-artifact@v4
        with:
          name: finzytrack-${{ runner.os }}
          path: shell/src-tauri/target/release/bundle/
          retention-days: 7
