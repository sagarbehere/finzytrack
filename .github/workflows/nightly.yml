# T2 nightly (design/process/PROCESS.md §6): deterministic only; no AI, no agent runs, no secrets.
# Grows as T2 items arrive (full acceptance suite, 54k performance and memory, D1 corpus, docs link check).
# GitHub runs `schedule` only from the default branch (main); until the owner's answer to
# design/inbox/20261025-nightly-schedule-needs-main.md, a caller on main runs this file with `ref: next`.
name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to test"
        type: string
        default: "next"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cargo-age:
    # EP-24: every publish date in shell/src-tauri/Cargo.lock.dates re-read from crates.io (about 12 minutes at
    # crates.io's one request per second).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cargo crates at least 14 days old, all dates verified
        run: python3 scripts/check_cargo_age.py --verify-all
  packaged:
    uses: ./.github/workflows/packaged.yml
    with:
      ref: ${{ inputs.ref }}
