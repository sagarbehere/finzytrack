# T1 (design/process/PROCESS.md §6): deterministic gates only; no AI, no agent runs, no secrets.
# Started by hand, before each release and on demand (ADR-0060); the per-push gate is the T0 pre-push hook.
# Jobs for backend/, frontend/ and shell/ are added by the slice that creates each package (BL-0037).
# backend: S0006; frontend: S0009; shell: S0010.
name: ci
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to test (empty: the selected branch)"
        type: string
        default: ""
      milestone_exit:
        description: "A milestone-exit run for this milestone (e.g. M0; empty: an ordinary run). Fails while an invariant, backlog item or fixme test due by it is still open (roadmap §3.2)"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      milestone_exit:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  repo-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv (the privacy scan runs detect-secrets from scripts/secrets-scan)
        run: python3 -m pip install uv==0.13.0
      - name: Backend environment (the licence check reads its runtime closure; the harness meta-tests start the sidecar)
        run: uv sync --locked --directory backend
      - name: Check-script meta-tests (in parallel, one process per test class; S0034)
        run: python3 scripts/run_meta_tests.py -v
      - name: Privacy scan of every tracked file (INV-23)
        run: python3 scripts/privacy_scan.py --all
      - name: Staged-file guard over every tracked file (INV-23)
        run: git ls-files -z | xargs -0 python3 scripts/check_staged.py --paths
      - name: Invariants (a milestone-exit run when the milestone_exit input is set; S0031)
        env:
          FT_MILESTONE_EXIT: ${{ inputs.milestone_exit }}
        run: python3 scripts/check_invariants.py
      - name: Capability map
        run: python3 scripts/check_capabilities.py
      - name: Generated artifacts (INV-19)
        run: python3 scripts/check_generated.py --all
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Frontend environment (the licence check reads its production tree)
        run: npm install -g pnpm@12.12.0 && pnpm --dir frontend install --frozen-lockfile
      - name: Rust toolchain from shell/src-tauri/rust-toolchain.toml (the licence check runs cargo metadata)
        run: cd shell/src-tauri && rustup show active-toolchain || rustup toolchain install
      - name: Licences and THIRD_PARTY_NOTICES
        run: python3 scripts/check_licences.py
      - name: Cargo crates at least 14 days old (offline; the dates are re-read in nightly.yml)
        run: python3 scripts/check_cargo_age.py
  backend:
    # The main sidecar (S0006; ARCHITECTURE.md §2, §10; ADR-0054): format, lint, strict types, import
    # contracts, declared dependencies, tests (incl. the architecture tests: no Beancount in this environment).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # The demo pins are checked against their git history (tests/content/test_demo_pins.py; S0032).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python3 -m pip install uv==0.13.0
      - name: Environment from the lockfile (Python from .python-version)
        run: uv sync --locked
      - name: ruff format
        run: .venv/bin/ruff format --check --config ruff.toml .
      - name: ruff lint
        run: .venv/bin/ruff check --config ruff.toml .
      - name: pyright (strict)
        run: .venv/bin/pyright
      - name: import contracts
        run: .venv/bin/lint-imports
      - name: declared dependencies
        run: .venv/bin/deptry src
      - name: tests
        run: .venv/bin/pytest -q
  frontend:
    # The Vue frontend (S0009; ARCHITECTURE.md §3, §10; ADR-0053): types, lint, format, unit tests (incl. the
    # pinned tsconfig and the lint bans), unused code, and the Playwright flows through the acceptance harness (S0030).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Install pnpm
        run: npm install -g pnpm@12.12.0
      - name: Environment from the lockfile
        run: pnpm install --frozen-lockfile
      - name: vue-tsc
        run: pnpm -s typecheck
      - name: eslint
        run: pnpm -s lint
      - name: prettier
        run: pnpm -s format:check
      - name: unit tests
        run: pnpm -s test
      - name: knip
        run: pnpm -s knip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Backend environment (the acceptance harness starts the sidecar and the demo generator from it; S0030)
        run: python3 -m pip install uv==0.13.0 && uv sync --locked --directory ../backend
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: acceptance flows through the harness (Chromium and WebKit west of UTC, Chromium in Kolkata)
        run: pnpm -s e2e
  shell:
    # The Tauri desktop shell (S0010; ADR-0007; ARCHITECTURE.md §5): format, pedantic clippy and unit tests on
    # Linux. Packaged builds and --smoke-test on three OSes: packaged.yml (S0012).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shell/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: System libraries for Tauri on Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (pedantic, warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: unit tests (incl. the --smoke-test verdict)
        run: cargo test --locked
  oracle-unit:
    # The differential-oracle harness's semantic diff, models and classifiers (S0002). End-to-end runs need the
    # legacy worktree and stay local (PROCESS.md §6, T-local).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python3 -m pip install uv==0.13.0
      - name: Oracle unit tests
        run: uv run --project scripts/oracle --locked python -m unittest discover -s scripts/oracle/tests -v
