# T1 (design/process/PROCESS.md §6): deterministic gates only; no AI, no agent runs, no secrets.
# Started by hand, before each release and on demand (ADR-0060); the per-push gate is the T0 pre-push hook.
# Jobs for backend/, frontend/ and shell/ are added by the slice that creates each package (BL-0037).
# backend: S0006; frontend: S0009; shell: S0010; engine: S0035.
# Every job's timeout-minutes is a hang backstop only, far above a normal run, not a budget (owner rule, S0034;
# S0036: the frontend job was cancelled at its old 15-minute limit while installing the Playwright browsers).
name: ci
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to test (empty: the selected branch)"
        type: string
        default: ""
      milestone_exit:
        description: "A milestone-exit run for this milestone (e.g. M0; empty: an ordinary run). Fails while an invariant, backlog item or fixme test due by it is still open (roadmap §3.2)"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      milestone_exit:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  repo-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv (the privacy scan runs detect-secrets from scripts/secrets-scan)
        run: python3 -m pip install uv==0.13.0
      - name: Backend environment (the licence check reads its runtime closure; the harness meta-tests start the sidecar)
        run: uv sync --locked --directory backend
      - name: Engine environment (the harness meta-tests start the sidecar's engine from it, S0038; the generated protocol
          schema and the licence check read it, S0035)
        run: uv sync --locked --directory engine
      - name: Check-script meta-tests (in parallel, one process per test class; S0034)
        run: python3 scripts/run_meta_tests.py -v
      - name: Privacy scan of every tracked file (INV-23)
        run: python3 scripts/privacy_scan.py --all
      - name: Staged-file guard over every tracked file (INV-23)
        run: git ls-files -z | xargs -0 python3 scripts/check_staged.py --paths
      - name: Invariants (a milestone-exit run when the milestone_exit input is set; S0031)
        env:
          FT_MILESTONE_EXIT: ${{ inputs.milestone_exit }}
        run: python3 scripts/check_invariants.py
      - name: Capability map
        run: python3 scripts/check_capabilities.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Frontend environment (the API types are generated with it, S0046; the licence check reads its production tree)
        run: npm install -g pnpm@12.12.0 && pnpm --dir frontend install --frozen-lockfile
      - name: Generated artifacts (INV-19)
        run: python3 scripts/check_generated.py --all
      - name: Diagnosis — the mirror checksums as this runner builds them, when a step failed (S0112; prints only)
        if: failure()
        run: |
          engine/.venv/bin/python -I engine/scripts/gen_mirror_checksums.py --stdout > "$RUNNER_TEMP/mirror-checksums.json" || true
          diff corpora/ledgers/mirror-checksums.json "$RUNNER_TEMP/mirror-checksums.json" || true
      - name: Rust toolchain from shell/src-tauri/rust-toolchain.toml (the licence check runs cargo metadata)
        run: cd shell/src-tauri && rustup show active-toolchain || rustup toolchain install
      - name: Licences and THIRD_PARTY_NOTICES
        run: python3 scripts/check_licences.py
      - name: Cargo crates at least 14 days old (offline; the dates are re-read in nightly.yml)
        run: python3 scripts/check_cargo_age.py
  backend:
    # The main sidecar (S0006; ARCHITECTURE.md §2, §10; ADR-0054): format, lint, strict types, import
    # contracts, declared dependencies, tests (incl. the architecture tests: no Beancount in this environment).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # The demo pins are checked against their git history (tests/content/test_demo_pins.py; S0032).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python3 -m pip install uv==0.13.0
      - name: Environment from the lockfile (Python from .python-version)
        run: uv sync --locked
      - name: ruff format
        run: .venv/bin/ruff format --check --config ruff.toml .
      - name: ruff lint
        run: .venv/bin/ruff check --config ruff.toml .
      - name: pyright (strict, once per target platform; S0113)
        run: python3 ../scripts/pyright_platforms.py .
      - name: import contracts
        run: .venv/bin/lint-imports
      - name: declared dependencies
        run: .venv/bin/deptry src
      - name: Engine environment (the engine client tests spawn the real engine; S0035)
        run: uv sync --locked --directory ../engine
      - name: tests
        run: .venv/bin/pytest -q
  engine:
    # The ledger engine, its own process and environment (S0035; ADR-0054; ARCHITECTURE.md §2.0, §10): format,
    # lint, strict types, tests (incl. the architecture test, which runs scripts/check_engine_boundary.py over
    # `git ls-files`).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python3 -m pip install uv==0.13.0
      - name: Environment from the lockfile (Python from .python-version)
        run: uv sync --locked
      - name: ruff format
        run: .venv/bin/ruff format --check --config ruff.toml .
      - name: ruff lint
        run: .venv/bin/ruff check --config ruff.toml .
      - name: pyright (strict, once per target platform; S0113)
        run: python3 ../scripts/pyright_platforms.py .
      # S0125 (BL-0266): scratch volumes of each kind a Linux user may keep a ledger on, formatted in loop images, and
      # the file-system probe on them and on the runner's own folders (prints only). The tests then run the save on
      # each (`tests/fs/test_linux.py`: FT_TEST_VOLUMES, FT_TEST_CASEFOLD_DIR). A kind whose tools are missing is
      # left out and said so.
      - name: Scratch volumes and the Linux file-system probe (S0125; prints only)
        run: |
          sudo apt-get install -y -q dosfstools exfatprogs btrfs-progs xfsprogs > /dev/null || echo "some tools missing"
          vols=""
          for kind in vfat exfat btrfs xfs ext2 ext4cf; do
            img="$RUNNER_TEMP/$kind.img"; mnt="$RUNNER_TEMP/vol-$kind"
            truncate -s 320M "$img" && mkdir -p "$mnt"
            case $kind in
              vfat) fmt="mkfs.vfat -F 32 $img" ;; exfat) fmt="mkfs.exfat $img" ;; btrfs) fmt="mkfs.btrfs -q $img" ;;
              xfs) fmt="mkfs.xfs -q $img" ;; ext2) fmt="mkfs.ext2 -q -F $img" ;; ext4cf) fmt="mkfs.ext4 -q -F -O casefold $img" ;;
            esac
            if ! $fmt > /dev/null; then echo "no $kind volume (format failed)"; continue; fi
            case $kind in
              vfat|exfat) sudo mount -o "loop,uid=$(id -u),gid=$(id -g)" "$img" "$mnt" ;;
              *) sudo mount -o loop "$img" "$mnt" && sudo chown "$(id -u):$(id -g)" "$mnt" ;;
            esac || { echo "no $kind volume (mount failed)"; continue; }
            vols="$vols:$mnt"
          done
          if [ -d "$RUNNER_TEMP/vol-ext4cf" ] && mkdir "$RUNNER_TEMP/vol-ext4cf/cf" && chattr +F "$RUNNER_TEMP/vol-ext4cf/cf"; then
            echo "FT_TEST_CASEFOLD_DIR=$RUNNER_TEMP/vol-ext4cf/cf" >> "$GITHUB_ENV"
          fi
          echo "FT_TEST_VOLUMES=${vols#:}" >> "$GITHUB_ENV"
          uname -r
          .venv/bin/python scripts/probe_linux_fs.py "$RUNNER_TEMP" /tmp /dev/shm "$HOME" ${vols//:/ } "$RUNNER_TEMP/vol-ext4cf/cf"
      - name: tests
        run: .venv/bin/python -m pytest -q
  engine-windows:
    # The ledger engine on Windows (S0126, BL-0087; ADR-0061 decision 6 and its 2026-11-14 amendment): the Windows
    # file-system probe on the runner's folders and on scratch volumes (VHDs formatted FAT32, exFAT and ReFS; prints
    # only), then the engine's tests. Until the Windows port lands, the engine refuses every file operation there
    # (`engine.unsupported_platform`) and its real-disk write-contract tests skip.
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.13.0
      - name: Environment from the lockfile (Python from .python-version)
        run: uv sync --locked
      - name: Scratch volumes and the Windows file-system probe (S0126; prints only)
        run: |
          $vols = @()
          foreach ($v in @(@{fs="fat32"; letter="R"}, @{fs="exfat"; letter="S"}, @{fs="refs"; letter="T"})) {
            $vhd = Join-Path $env:RUNNER_TEMP ("vol-" + $v.fs + ".vhdx")
            $size = if ($v.fs -eq "refs") { 2048 } else { 320 }
            $script = Join-Path $env:RUNNER_TEMP ("dp-" + $v.fs + ".txt")
            @(
              "create vdisk file=`"$vhd`" maximum=$size type=expandable",
              "select vdisk file=`"$vhd`"",
              "attach vdisk",
              "create partition primary",
              "format fs=$($v.fs) quick label=FT$($v.fs.ToUpper())",
              "assign letter=$($v.letter)"
            ) | Set-Content -Encoding ascii $script
            diskpart /s $script | Out-Null
            if (Test-Path ($v.letter + ":\")) { $vols += ($v.letter + ":\") } else { Write-Output ("no " + $v.fs + " volume") }
          }
          "FT_TEST_VOLUMES=" + ($vols -join ";") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # A network share on this machine (S0132, BL-0294): an SMB volume that may report NTFS without offering the
          # rename with POSIX semantics; its tests take `FT_TEST_SHARE` (a mapped drive first, then the UNC path, then
          # the UNC path by the machine's own name: S0134, BL-0298's three spellings).
          # Never a quiet skip (S0132 round 1, verifier V5): a share that cannot be made fails the job here.
          $dir = Join-Path $env:RUNNER_TEMP "ftshare"
          New-Item -ItemType Directory -Force $dir | Out-Null
          New-SmbShare -Name ftshare -Path $dir -FullAccess Everyone -ErrorAction Stop | Out-Null
          if (-not (Test-Path "\\localhost\ftshare")) { throw "the CI share \\localhost\ftshare is not reachable" }
          net use Z: "\\localhost\ftshare" /persistent:no | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "Z:\")) { throw "the CI share could not be mapped to Z:" }
          $shares = @("Z:\", "\\localhost\ftshare", "\\$env:COMPUTERNAME\ftshare")  # mapped drive, UNC, UNC by name
          "FT_TEST_SHARE=" + ($shares -join ";") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          [System.Environment]::OSVersion.VersionString
          .venv\Scripts\python.exe scripts\probe_windows_fs.py $env:RUNNER_TEMP $env:TEMP @vols @shares
      - name: The whole save on the network share, its exclusive create, replace and identity (BL-0219; prints only)
        # The engine's own save, run by the probe on the share's three spellings and, for comparison, a local NTFS
        # folder; then the share folder's identity read once, after remapping the drive, and after restarting the
        # server service. The later test step needs the share and the mapping: both are checked again at the end, and
        # the step fails if either cannot be remade.
        run: |
          $shares = $env:FT_TEST_SHARE -split ";"
          $backing = Join-Path $env:RUNNER_TEMP "ftshare"
          $roots = $shares + @($backing)
          .venv\Scripts\python.exe scripts\probe_windows_share_save.py probe $env:RUNNER_TEMP @shares
          try {
            .venv\Scripts\python.exe scripts\probe_windows_share_save.py identity first @roots
            Get-SmbConnection | Format-Table -AutoSize | Out-String | Write-Output
            net use Z: /delete /y | Out-Null
            net use Z: "\\localhost\ftshare" /persistent:no | Out-Null
            Write-Output ("remapped Z: exit " + $LASTEXITCODE)
            .venv\Scripts\python.exe scripts\probe_windows_share_save.py identity remapped @roots
            # Did the restart drop the sessions? The sessions and connections around it, and a handle held across it.
            $held = Join-Path "Z:\" ".ft-identity-probe\held.txt"
            $fs = $null
            try {
              [System.IO.File]::WriteAllText($held, "held")
              $fs = [System.IO.File]::Open($held, "Open", "ReadWrite", "ReadWrite")
            } catch {
              Write-Output ("no handle could be held across the restart: " + $_.Exception.Message)
            }
            try {
              $smb = {
                param($when)
                Write-Output ("SMB sessions " + $when + ":")
                Get-SmbSession | Format-Table SessionId, ClientComputerName, ClientUserName, NumOpens, SecondsExists -AutoSize | Out-String | Write-Output
                Write-Output ("SMB connections " + $when + ":")
                Get-SmbConnection | Format-Table ServerName, ShareName, Dialect, NumOpens -AutoSize | Out-String | Write-Output
              }
              & $smb "before the restart"
              try {
                $deps = @((Get-Service LanmanServer).DependentServices | Where-Object Status -eq "Running")
                Write-Output ("restarting LanmanServer; running dependants: " + (($deps | ForEach-Object Name) -join ", "))
                Restart-Service LanmanServer -Force -ErrorAction Stop
                foreach ($d in $deps) { Start-Service $d.Name -ErrorAction Continue }
                Write-Output ("LanmanServer: " + (Get-Service LanmanServer).Status)
              } catch {
                Write-Output ("the server service could not be restarted: " + $_)
              }
              & $smb "after the restart"
              if ($fs) { try {
                $fs.Position = 0
                $buf = New-Object byte[] 16
                $n = $fs.Read($buf, 0, 16)
                Write-Output ("read through the handle held across the restart: ok, " + $n + " bytes")
              } catch {
                Write-Output ("read through the handle held across the restart: failed: " + $_.Exception.Message)
              }
              try {
                $fs.Position = 0
                $fs.Write([byte[]](104, 101, 108, 100), 0, 4)
                $fs.Flush($true)
                Write-Output "write and flush through the handle held across the restart: ok"
              } catch {
                Write-Output ("write and flush through the handle held across the restart: failed: " + $_.Exception.Message)
              } }
            } finally {
              if ($fs) { try { $fs.Close() } catch { Write-Output ("closing the held handle: " + $_.Exception.Message) } }
            }
            if (-not (Get-SmbShare -Name ftshare -ErrorAction SilentlyContinue)) {
              Write-Output "the share is gone after the restart: made again"
              New-SmbShare -Name ftshare -Path $backing -FullAccess Everyone -ErrorAction Stop | Out-Null
            }
            if (-not (Test-Path "Z:\")) {
              Write-Output "Z: is not reachable after the restart: mapped again"
              net use Z: /delete /y 2>$null | Out-Null
              net use Z: "\\localhost\ftshare" /persistent:no | Out-Null
            }
            .venv\Scripts\python.exe scripts\probe_windows_share_save.py identity restarted @roots
          } finally {
            .venv\Scripts\python.exe scripts\probe_windows_share_save.py identity-remove $backing
          }
          foreach ($s in $shares) {
            if (-not (Test-Path $s)) { throw "the CI share is not reachable as $s after the identity probe" }
          }
          $global:LASTEXITCODE = 0
      - name: tests
        # INV-07 on Windows (S0127): its C runtime reads TZ only as a process starts and only in this form, so it is set
        # before Python starts (Los Angeles: tests/conftest.py checks it). `-rs`: each skip prints its reason, the
        # backlog item that turns it on (tests/windows_pending.py).
        env:
          TZ: PST8PDT
        run: .venv\Scripts\python.exe -m pytest -q -rs -p no:cacheprovider
  backend-windows:
    # The main sidecar on Windows (S0129, BL-0281; ADR-0061 and its 2026-11-14 amendment): the whole backend suite
    # (S0131, BL-0290). Each test passes or skips with a reason from `tests/windows_pending.py` (the engine's write path,
    # which Windows refuses until BL-0087; POSIX-only rules, with their Windows tests named). Lint and types run in the
    # `backend` job (pyright for all three platforms).
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.13.0
      - name: Environment from the lockfile (Python from .python-version)
        run: uv sync --locked
      - name: Engine environment (the engine client tests spawn the real engine)
        run: uv sync --locked --directory ../engine
      - name: Scratch volumes (S0129 round 1, the app folder's identity on FAT32, exFAT and ReFS, as engine-windows)
        run: |
          $vols = @()
          foreach ($v in @(@{fs="fat32"; letter="R"}, @{fs="exfat"; letter="S"}, @{fs="refs"; letter="T"})) {
            $vhd = Join-Path $env:RUNNER_TEMP ("vol-" + $v.fs + ".vhdx")
            $size = if ($v.fs -eq "refs") { 2048 } else { 320 }
            $script = Join-Path $env:RUNNER_TEMP ("dp-" + $v.fs + ".txt")
            @(
              "create vdisk file=`"$vhd`" maximum=$size type=expandable",
              "select vdisk file=`"$vhd`"",
              "attach vdisk",
              "create partition primary",
              "format fs=$($v.fs) quick label=FT$($v.fs.ToUpper())",
              "assign letter=$($v.letter)"
            ) | Set-Content -Encoding ascii $script
            diskpart /s $script | Out-Null
            if (Test-Path ($v.letter + ":\")) { $vols += ($v.letter + ":\") } else { Write-Output ("no " + $v.fs + " volume") }
          }
          "FT_TEST_VOLUMES=" + ($vols -join ";") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: tests
        # INV-07 on Windows (S0127): `TZ` in the C runtime's form, set before Python starts (tests/conftest.py checks
        # Los Angeles). `-rs`: each skip prints its reason; `-v`: a line per test, so the log's timestamps show a slow
        # one even in a job cut at its limit, and `--durations` lists the slowest (S0131: one run took 59 of the job's
        # 60 minutes).
        env:
          TZ: PST8PDT
        run: >-
          .venv\Scripts\python.exe -m pytest -v -rs --durations=25 -p no:cacheprovider tests
  frontend:
    # The Vue frontend (S0009; ARCHITECTURE.md §3, §10; ADR-0053): types, lint, format, unit tests (incl. the
    # pinned tsconfig and the lint bans), unused code, and the Playwright flows through the acceptance harness (S0030).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Install pnpm
        run: npm install -g pnpm@12.12.0
      - name: Environment from the lockfile
        run: pnpm install --frozen-lockfile
      - name: vue-tsc
        run: pnpm -s typecheck
      - name: eslint
        run: pnpm -s lint
      - name: prettier
        run: pnpm -s format:check
      - name: unit tests
        run: pnpm -s test
      - name: knip
        run: pnpm -s knip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Backend environment (the acceptance harness starts the sidecar and the demo generator from it; S0030)
        run: python3 -m pip install uv==0.13.0 && uv sync --locked --directory ../backend
      - name: Engine environment (the acceptance harness's sidecar starts its ledger engine from it; S0038)
        run: uv sync --locked --directory ../engine
      # The browsers are cached by the exact Playwright version the lockfile installs (S0036); the Linux system
      # packages they need are installed on every run, since apt packages are not in the cache.
      - name: Playwright version (the browser cache key)
        id: pw
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      - name: Playwright browsers and system packages (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Playwright system packages (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit
      - name: acceptance flows through the harness (Chromium and WebKit west of UTC, Chromium in Kolkata)
        run: pnpm -s e2e
  shell:
    # The Tauri desktop shell (S0010; ADR-0007; ARCHITECTURE.md §5): format, pedantic clippy and unit tests on
    # Linux. Packaged builds and --smoke-test on three OSes: packaged.yml (S0012).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shell/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: System libraries for Tauri on Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (pedantic, warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: unit tests (incl. the --smoke-test verdict)
        run: cargo test --locked
  oracle-unit:
    # The differential-oracle harness's semantic diff, models and classifiers (S0002). End-to-end runs need the
    # legacy worktree and stay local (PROCESS.md §6, T-local).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python3 -m pip install uv==0.13.0
      - name: Oracle unit tests
        run: uv run --project scripts/oracle --locked python -m unittest discover -s scripts/oracle/tests -v
