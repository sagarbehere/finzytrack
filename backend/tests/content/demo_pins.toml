# The demo generator's output, per GENERATOR_VERSION (app.content.demo.compose): the SHA-256 of main.beancount for each
# size at the anchor 2026-10-25 (S0027 verifier F2; S0032, seeded plant C08). A change detector, not a spec value
# (EP-29 exempts it as a characterization pin).
#
# Append-only. A version's pins never change and are never removed: output that changes on purpose raises
# GENERATOR_VERSION and adds that version's pins below, in the same commit. tests/content/test_demo_pins.py checks the
# file against its own git history, so regenerating the pins under the same version fails.

