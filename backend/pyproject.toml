# The main sidecar (ADR-0054): our source is GPL-2.0-or-later; the distributed sidecar is GPLv3. Never imports Beancount. Package map: design/ARCHITECTURE.md §2.
# Runtime dependencies arrive with the slice that first uses each one; pins: ARCHITECTURE.md §10 (EP-24).
[project]
name = "finzytrack-backend"
version = "0.4.0.dev0"
requires-python = "==3.13.*"
license = "GPL-2.0-or-later"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "starlette==1.8.0",
    "structlog==26.1.0",
    "uuid-utils==0.17.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "coverage==7.16.2",
  "deptry==0.25.1",
  "httpx==0.28.1",
  "hypothesis==6.168.4",
  "import-linter==2.15",
  "jsonschema==4.26.0",
  "pip-licenses==5.5.5",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "ruff==0.17.0",
]

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "14 days"

[tool.uv.build-backend]
module-name = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-p", "no:cacheprovider"]
markers = [
  "inv(id): the invariant a test enforces (design/INVARIANTS.md; scripts/check_invariants.py)",
  "cap(id): the capability a test covers (design/capabilities.toml)",
  "error_code(code): the error registry code a test triggers through the API (ARCHITECTURE.md §6.7; tests/api/test_error_registry.py)",
  "fixme(id, due, reason): written before its capability exists; runs as a strict xfail; id names an open backlog row due by `due` (scripts/check_invariants.py, S0029)",
]
xfail_strict = true
# An empty parametrize list (however it is spelled) fails at collection instead of skipping (S0031 verifier R2-1).
empty_parameter_set_mark = "fail_at_collect"

[tool.deptry]
known_first_party = ["app"]
