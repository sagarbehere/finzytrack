# Format and lint for backend/ (ARCHITECTURE.md §10). Run from the repo root with --config backend/ruff.toml.
target-version = "py313"
line-length = 120

[lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE", "DTZ", "S", "TRY", "TID", "PT", "SIM", "RUF", "PGH"]

[lint.per-file-ignores]
# pytest asserts; the pattern matches from the repo root (pre-commit) and from backend/ (CI)
"**/tests/**" = ["S101"]

[lint.flake8-tidy-imports.banned-api]
"datetime.date.today".msg = "INV-07: there is no UTC or system 'today'; use domain.today(tz, clock)"
"datetime.datetime.now".msg = "INV-07, EP-10: time comes from the injected Clock port"
"datetime.datetime.utcnow".msg = "INV-07, EP-10: time comes from the injected Clock port"
"time.sleep".msg = "EP-28: no sleeps; wait on a condition or use the injected Clock"
"time.time".msg = "INV-07, EP-10: time comes from the injected Clock port"
"time.time_ns".msg = "INV-07, EP-10: time comes from the injected Clock port"
"time.localtime".msg = "INV-07, EP-10: time comes from the injected Clock port"
"time.gmtime".msg = "INV-07, EP-10: time comes from the injected Clock port"
"time.strftime".msg = "INV-07, EP-10: time comes from the injected Clock port"
"time.ctime".msg = "INV-07, EP-10: time comes from the injected Clock port"
