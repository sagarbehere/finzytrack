about = "Probed as a commodity directive and as an amount's currency; both must parse to exactly the code (a prefix match is not enough: USD ;x parses as a commodity USD with a comment)."
codes = [
  { code = "USD", polarity = "positive" },
  { code = "V", polarity = "positive" },
  { code = "AB", polarity = "positive" },
  { code = "X1", polarity = "positive" },
  { code = "NT.TO", polarity = "positive" },
  { code = "BTC-USD", polarity = "positive" },
  { code = "A'B", polarity = "positive" },
  { code = "TLT_040921C144", polarity = "positive" },
  { code = "/6J", polarity = "positive" },
  { code = "/NQH21", polarity = "positive" },
  { code = "/NQH21_QNEG21C13100", polarity = "positive" },
  { code = "ABCDEFGHIJKLMNOPQRSTUVWXYZABCD", polarity = "positive" },
  { code = "/6.3", polarity = "negative" },
  { code = "CAC_", polarity = "negative" },
  { code = "ABC.", polarity = "negative" },
  { code = "usd", polarity = "negative" },
  { code = "Usd", polarity = "negative" },
  { code = "1USD", polarity = "negative" },
  { code = "U$D", polarity = "negative" },
  { code = "€", polarity = "negative" },
  { code = "USD ;x", polarity = "negative" },
]

# ---- price: the price map (build_price_map, get_price) -------------------------------------------------------

[[price]]
id = "price/as-of"
spec = ["beancount:beancount.core.prices.get_price", "beancount:beancount.core.prices.build_price_map", "ADR-0024", "ADR-0025", "review:L3 §1.5.6"]
about = "As-of lookup is inclusive of the date; a future-dated price is excluded for an earlier date but is the latest price; lookups are quote-specific; the inverse is 1/price."
setup = """
2020-01-01 price VTI 100.00 USD
2020-01-10 price VTI 110.00 USD
2030-01-01 price VTI 999.00 USD
"""
queries = [
  { base = "VTI", quote = "USD", date = "2020-01-10", polarity = "positive" },
  { base = "VTI", quote = "USD", date = "2020-01-09", polarity = "positive" },
  { base = "VTI", quote = "USD", date = "2019-12-31", polarity = "negative" },
  { base = "VTI", quote = "USD", date = "2025-01-01", polarity = "positive" },
  { base = "VTI", quote = "USD", date = "latest", polarity = "positive" },
  { base = "USD", quote = "VTI", date = "2020-01-10", polarity = "positive" },
  { base = "VTI", quote = "EUR", date = "2020-06-01", polarity = "negative" },
  { base = "VTI", quote = "VTI", date = "2020-06-01", polarity = "positive" },
]

[[price]]
id = "price/same-day-last-wins"
spec = ["beancount:beancount.core.prices.build_price_map", "beancount:beancount.utils.misc_utils.sorted_uniquify", "ADR-0024"]
about = "Two prices for one pair on one day: the later one in the file is kept."
setup = """
2020-01-01 price VTI 100.00 USD
2020-01-01 price VTI 101.00 USD
"""
queries = [
  { base = "VTI", quote = "USD", date = "2020-01-01", polarity = "positive" },
]

[[price]]
id = "price/both-directions"
spec = ["beancount:beancount.core.prices.build_price_map", "ADR-0024"]
about = "Prices in both directions are merged into the direction with more points; on a shared day the inverted point is kept."
setup = """
2020-01-01 price USD 75 INR
2020-01-02 price USD 76 INR
2020-01-02 price INR 0.0125 USD
"""
queries = [
  { base = "USD", quote = "INR", date = "2020-01-02", polarity = "positive" },
  { base = "INR", quote = "USD", date = "2020-01-02", polarity = "positive" },
  { base = "INR", quote = "USD", date = "2020-01-01", polarity = "positive" },
]

[[price]]
id = "price/zero-not-inverted"
spec = ["beancount:beancount.core.prices.build_price_map"]
about = "A zero price is kept forward but has no inverse."
setup = """
2020-01-01 price XYZ 0 USD
"""
queries = [
  { base = "XYZ", quote = "USD", date = "2020-01-01", polarity = "positive" },
  { base = "USD", quote = "XYZ", date = "2020-01-01", polarity = "negative" },
]

[[price]]
id = "price/no-triangulation"
spec = ["beancount:beancount.core.prices.get_price", "ADR-0024"]
about = "No chaining through a third currency: VTI in USD and USD in INR give no VTI in INR."
setup = """
2020-01-01 price VTI 100.00 USD
2020-01-01 price USD 75 INR
"""
queries = [
  { base = "VTI", quote = "INR", date = "2020-01-01", polarity = "negative" },
]

[[price]]
id = "price/implicit-prices-plugin"
spec = ["beancount:beancount.plugins.implicit_prices.add_implicit_prices", "beancount:beancount.core.prices.build_price_map"]
about = "With the implicit_prices plugin, a posting's price and cost become price entries."
setup = """
plugin "beancount.plugins.implicit_prices"
2020-01-01 * "buy"
  Assets:Broker  10 VTI {100.00 USD}
  Assets:Bank  -1000.00 USD
2020-02-01 * "convert"
  Assets:Bank  -100.00 USD @ 75.50 INR
  Assets:BankIn  7550.00 INR
"""
queries = [
  { base = "VTI", quote = "USD", date = "2020-01-01", polarity = "positive" },
  { base = "USD", quote = "INR", date = "2020-02-01", polarity = "positive" },
]

[[price]]
id = "price/no-implicit-without-plugin"
spec = ["beancount:beancount.core.prices.build_price_map"]
about = "Without the plugin, postings make no prices."
setup = """
2020-01-01 * "buy"
  Assets:Broker  10 VTI {100.00 USD}
  Assets:Bank  -1000.00 USD
"""
queries = [
  { base = "VTI", quote = "USD", date = "2020-01-01", polarity = "negative" },
]

# ---- precision: display precision from the display context (dcontext) ---------------------------------------

[[precision]]
id = "precision/most-common-and-maximum"
spec = ["beancount:beancount.core.display_context.DisplayContext", "ADR-0023", "review:L3-verif §3.1"]
about = "Every number Beancount parses counts: units, costs, prices, balances. A 10-digit cost raises USD's maximum but not its most common; integers count as 0 digits."
setup = """
2020-01-01 price BTC 30000.12345678 USD
2020-01-02 * "buy"
  Assets:Wallet  0.12345678 BTC {100.1234567890 USD}
  Assets:Bank  -12.36 USD
2020-01-03 * "fee"
  Assets:Bank  -1.00 USD
  Expenses:Fees  1.00 USD
2020-01-04 * "yen"
  Assets:Yen  100 JPY
  Income:Gift  -100 JPY
2020-01-05 balance Assets:Pounds  0.000 GBP
"""
currencies = [
  { currency = "USD", polarity = "positive" },
  { currency = "BTC", polarity = "positive" },
  { currency = "JPY", polarity = "positive" },
  { currency = "GBP", polarity = "positive" },
  { currency = "CHF", polarity = "negative" },
]

[[precision]]
id = "precision/tie"
spec = ["beancount:beancount.core.display_context.DisplayContext", "beancount:beancount.core.distribution.Distribution.mode", "ADR-0023"]
about = "Equal counts of 1 and 2 fractional digits: Beancount's tie-break decides the most common."
setup = """
2020-01-01 * "a"
  Assets:Bank  1.5 EUR
  Income:Gift  -1.5 EUR
2020-01-02 * "b"
  Assets:Bank  1.25 EUR
  Income:Gift  -1.25 EUR
"""
currencies = [
  { currency = "EUR", polarity = "positive" },
  { currency = "USD", polarity = "negative" },
]

# ---- booking: which lots a reduction books, per booking method (ADR-0031) ------------------------------------
# Three lots of 10 VTI: 2020-01-01 at 100, 2020-02-01 at 120, 2020-03-01 at 90 (the setup of most cases).

[[booking]]
id = "booking/fifo"
polarity = "positive"
spec = ["beancount:beancount.parser.booking_method.booking_method_FIFO", "ADR-0031"]
about = "FIFO takes the oldest lots first."
setup = """
2000-01-01 open Assets:Broker "FIFO"
2020-01-01 * "lot 1"
  Assets:Broker  10 VTI {100 USD}
  Assets:Bank  -1000 USD
2020-02-01 * "lot 2"
  Assets:Broker  10 VTI {120 USD}
  Assets:Bank  -1200 USD
2020-03-01 * "lot 3"
  Assets:Broker  10 VTI {90 USD}
  Assets:Bank  -900 USD
"""
postings = [
  { account = "Assets:Broker", units = "-15 VTI", cost = "{}" },
  { account = "Assets:Bank" },
]

