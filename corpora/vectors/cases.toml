# Beancount domain vectors: the hand-written inputs (S0024; spec design/specs/kernel/vectors.md; INV-02, ADR-0024).
#
# scripts/oracle/gen_domain_vectors.py runs Beancount on every case and writes vectors.json beside this file.
# Each case or item declares its `polarity`: "positive" when Beancount accepts it (balanced, valid, found, known,
# booked), "negative" when Beancount refuses it or gives nothing. The checks refuse a polarity Beancount disagrees
# with. `spec` lists the citations: at least one `beancount:<module>.<symbol>` (the Beancount code that decides),
# plus ADRs (`ADR-nnnn`) and review sections (`review:<doc> §<n>`).
#
# Transaction cases: `postings` are rendered as one transaction dated 2020-06-01 with narration "vector";
# `setup` holds the directives before it; every account used and not opened is opened on 2000-01-01.

beancount = "3.2.0"

# ---- tolerance: transaction balancing (infer_tolerances, compute_residual, is_small) -------------------------

[[tolerance]]
id = "tolerance/integers-exact"
polarity = "positive"
spec = ["beancount:beancount.ops.validation.validate_check_transaction_balances", "ADR-0024"]
about = "Integer amounts infer no tolerance; an exact sum balances."
postings = [
  { account = "Assets:Bank", units = "-10 USD" },
  { account = "Expenses:Food", units = "10 USD" },
]

[[tolerance]]
id = "tolerance/written-scale-10.50"
polarity = "negative"
spec = ["beancount:beancount.core.interpolate.infer_tolerances", "review:L3-verif §2.5", "ADR-0023"]
about = "Written 10.50 gives a tolerance of 0.005, so a 4-cent split error does not balance."
postings = [
  { account = "Assets:Bank", units = "-10.50 USD" },
  { account = "Expenses:Food", units = "5.25 USD" },
  { account = "Expenses:Rent", units = "5.21 USD" },
]

[[tolerance]]
id = "tolerance/rescaled-10.5-passes"
polarity = "positive"
spec = ["beancount:beancount.core.interpolate.infer_tolerances", "review:L3-verif §2.5", "ADR-0023"]
about = "The same split with 10.50 rewritten as 10.5: the tolerance widens to 0.05 and the error passes. Why written scale must be kept."
postings = [
  { account = "Assets:Bank", units = "-10.5 USD" },
  { account = "Expenses:Food", units = "5.25 USD" },
  { account = "Expenses:Rent", units = "5.21 USD" },
]

[[tolerance]]
id = "tolerance/boundary-equal-passes"
polarity = "positive"
spec = ["beancount:beancount.core.inventory.Inventory.is_small", "beancount:beancount.core.interpolate.infer_tolerances"]
about = "A residual exactly equal to the tolerance balances (the test is |residual| > tolerance)."
postings = [
  { account = "Assets:Bank", units = "-10.00 USD" },
  { account = "Expenses:Food", units = "9.995 USD" },
]

[[tolerance]]
id = "tolerance/boundary-over-fails"
polarity = "negative"
spec = ["beancount:beancount.core.inventory.Inventory.is_small", "beancount:beancount.core.interpolate.infer_tolerances"]
about = "The largest tolerance wins per currency (0.005 from 10.00), and a residual of 0.006 is over it."
postings = [
  { account = "Assets:Bank", units = "-10.00 USD" },
  { account = "Expenses:Food", units = "9.994 USD" },
]

[[tolerance]]
id = "tolerance/multiplier-option"
polarity = "positive"
spec = ["beancount:beancount.core.interpolate.infer_tolerances", "ADR-0024"]
about = "option tolerance_multiplier 0.6 makes the tolerance of 10.00 0.006, so the previous case balances."
options = [["tolerance_multiplier", "0.6"]]
postings = [
  { account = "Assets:Bank", units = "-10.00 USD" },
  { account = "Expenses:Food", units = "9.994 USD" },
]

[[tolerance]]
id = "tolerance/default-option-absent"
polarity = "negative"
spec = ["beancount:beancount.core.interpolate.infer_tolerances"]
about = "Without a default, 9.99 infers 0.005 and a residual of 0.01 does not balance."
postings = [
  { account = "Assets:Bank", units = "-10 USD" },
  { account = "Expenses:Food", units = "9.99 USD" },
]

[[tolerance]]
id = "tolerance/default-option-per-currency"
polarity = "positive"
spec = ["beancount:beancount.core.interpolate.infer_tolerances", "ADR-0024"]
about = "inferred_tolerance_default USD:0.01 is the floor for USD: max(0.01, 0.005) = 0.01."
options = [["inferred_tolerance_default", "USD:0.01"]]
postings = [
  { account = "Assets:Bank", units = "-10 USD" },
  { account = "Expenses:Food", units = "9.99 USD" },
]

[[tolerance]]
id = "tolerance/default-star-applies-to-integers"
polarity = "positive"
spec = ["beancount:beancount.core.interpolate.infer_tolerances", "ADR-0024"]
about = "The * default applies to a currency that inferred nothing (integer EUR legs)."
options = [["inferred_tolerance_default", "*:0.001"]]
postings = [
  { account = "Assets:Broker", units = "10 VTI", price = "@ 100.0001 EUR" },
  { account = "Assets:Bank", units = "-1000 EUR" },
]

[[tolerance]]
id = "tolerance/default-star-limit"
polarity = "negative"
spec = ["beancount:beancount.core.interpolate.infer_tolerances"]
about = "The * default is the limit for a currency that inferred nothing: a residual of 0.002 EUR is over 0.001."
options = [["inferred_tolerance_default", "*:0.001"]]
postings = [
  { account = "Assets:Broker", units = "10 VTI", price = "@ 100.0002 EUR" },
  { account = "Assets:Bank", units = "-1000 EUR" },
]

[[tolerance]]
id = "tolerance/default-star-does-not-raise-inferred"
polarity = "negative"
spec = ["beancount:beancount.core.interpolate.infer_tolerances"]
about = "Trap: the * default is not a floor. EUR inferred 0.0005 from 9.999, the * value 0.001 is ignored for EUR, and a residual of 0.001 fails."
options = [["inferred_tolerance_default", "*:0.001"]]
postings = [
  { account = "Assets:Bank", units = "-10 EUR" },
  { account = "Expenses:Food", units = "9.999 EUR" },
]

[[tolerance]]
id = "tolerance/integer-cash-leg-zero-tolerance"
polarity = "negative"
spec = ["beancount:beancount.core.interpolate.infer_tolerances", "review:L3 §1.5.1", "ADR-0023"]
about = "Priced legs do not give tolerance to their price currency: with only integer USD written, USD tolerance is 0 and 0.04 fails."
postings = [
  { account = "Assets:Broker", units = "10 VTI", price = "@ 100.004 USD" },
  { account = "Assets:Bank", units = "-1000 USD" },
]

[[tolerance]]
id = "tolerance/padded-cash-leg"
polarity = "positive"
spec = ["beancount:beancount.core.interpolate.infer_tolerances", "review:L3 §1.5.1", "ADR-0023"]
about = "The cash leg written as 1000.00 gives USD a tolerance of 0.005, which absorbs the 0.004 residual."
postings = [
  { account = "Assets:Broker", units = "10 VTI", price = "@ 100.0004 USD" },
  { account = "Assets:Bank", units = "-1000.00 USD" },
]

[[tolerance]]
id = "tolerance/price-weight"
polarity = "positive"
spec = ["beancount:beancount.core.convert.get_weight", "beancount:beancount.core.interpolate.compute_residual"]
about = "A priced leg weighs units x price in the price currency."
postings = [
  { account = "Assets:Broker", units = "10 VTI", price = "@ 100.123 USD" },
  { account = "Assets:Bank", units = "-1001.23 USD" },
]

[[tolerance]]
id = "tolerance/total-price-division"
polarity = "positive"
spec = ["beancount:beancount.parser.grammar.Builder.posting", "review:L3-verif §2.3"]
about = "@@ is divided into a per-unit price (0.01/7, 28 significant digits); the weight is units x that price, rounded again to 28 digits, which gives back exactly 0.01 here."
postings = [
  { account = "Assets:Wallet", units = "7 TOK", price = "@@ 0.01 BTC" },
  { account = "Assets:Exchange", units = "-0.01 BTC" },
]

[[tolerance]]
id = "tolerance/total-cost-division"
polarity = "positive"
spec = ["beancount:beancount.parser.booking_full.interpolate_group", "beancount:beancount.core.convert.get_weight"]
about = "A total cost {{1000.00 USD}} on 3 units becomes a per-unit cost; its weight leaves a tiny residual."
postings = [
  { account = "Assets:Broker", units = "3 VTI", cost = "{{1000.00 USD}}" },
  { account = "Assets:Bank", units = "-1000.00 USD" },
]

[[tolerance]]
id = "tolerance/cost-not-price-weighs"
polarity = "positive"
spec = ["beancount:beancount.core.convert.get_weight", "ADR-0025"]
about = "A sale at cost with a price weighs at cost; the price is ignored for balancing, so the gain leg balances it."
setup = """
2020-01-01 * "buy"
  Assets:Broker  10 VTI {100 USD}
  Assets:Bank  -1000 USD
"""
postings = [
  { account = "Assets:Broker", units = "-5 VTI", cost = "{100 USD}", price = "@ 120 USD" },
  { account = "Assets:Bank", units = "600.00 USD" },
  { account = "Income:Gains", units = "-100.00 USD" },
]

[[tolerance]]
id = "tolerance/sale-without-gain-leg"
polarity = "negative"
spec = ["beancount:beancount.core.convert.get_weight"]
about = "The same sale without the gain leg leaves the gain as residual."
setup = """
2020-01-01 * "buy"
  Assets:Broker  10 VTI {100 USD}
  Assets:Bank  -1000 USD
"""
postings = [
  { account = "Assets:Broker", units = "-5 VTI", cost = "{100 USD}", price = "@ 120 USD" },
  { account = "Assets:Bank", units = "600.00 USD" },
]

[[tolerance]]
id = "tolerance/from-cost-option-off"
polarity = "negative"
spec = ["beancount:beancount.core.interpolate.infer_tolerances"]
about = "Beancount's docstring example without infer_tolerance_from_cost: USD tolerance 0.005, residual 0.02176 fails."
postings = [
  { account = "Assets:Investments:VWELX", units = "18.572 VWELX", cost = "{30.96 USD}" },
  { account = "Assets:Investments:VWELX", units = "18.572 VWELX", cost = "{30.96 USD}" },
  { account = "Assets:Investments:Cash", units = "-1150.00 USD" },
]

[[tolerance]]
id = "tolerance/from-cost-option-on"
polarity = "positive"
spec = ["beancount:beancount.core.interpolate.infer_tolerances", "ADR-0024"]
about = "With infer_tolerance_from_cost, unit precision times cost adds to USD tolerance (0.03096) and it balances."
options = [["infer_tolerance_from_cost", "TRUE"]]
postings = [
  { account = "Assets:Investments:VWELX", units = "18.572 VWELX", cost = "{30.96 USD}" },
  { account = "Assets:Investments:VWELX", units = "18.572 VWELX", cost = "{30.96 USD}" },
  { account = "Assets:Investments:Cash", units = "-1150.00 USD" },
]

[[tolerance]]
id = "tolerance/elided-leg-quantized"
polarity = "positive"
spec = ["beancount:beancount.parser.booking_full.interpolate_group", "review:L3-verif §3.2", "ADR-0024"]
about = "One elided leg is filled by Beancount, rounded to the currency's inferred precision (6.790, not 6.7897); the frontend port says indeterminate."
postings = [
  { account = "Assets:Bank", units = "-10.123 USD" },
  { account = "Expenses:Food", units = "3.3333 USD" },
  { account = "Expenses:Rent" },
]

[[tolerance]]
id = "tolerance/two-elided-legs"
polarity = "negative"
spec = ["beancount:beancount.parser.booking_full.interpolate_group", "ADR-0024"]
about = "Two elided legs in one currency cannot be filled: Beancount refuses."
postings = [
  { account = "Assets:Bank", units = "-10.00 USD" },
  { account = "Expenses:Food" },
  { account = "Expenses:Rent" },
]

[[tolerance]]
id = "tolerance/reduction-needs-booking"
polarity = "positive"
spec = ["beancount:beancount.parser.booking_full.book_reductions", "review:L3-verif §3.2", "ADR-0024", "ADR-0031"]
about = "A {} reduction's weight is known only after Beancount picks the lots (FIFO here): the frontend port says indeterminate."
setup = """
2000-01-01 open Assets:Broker "FIFO"
2020-01-01 * "buy"
  Assets:Broker  10 VTI {100 USD}
  Assets:Bank  -1000 USD
"""
postings = [
  { account = "Assets:Broker", units = "-5 VTI", cost = "{}", price = "@ 120 USD" },
  { account = "Assets:Bank", units = "600.00 USD" },
  { account = "Income:Gains", units = "-100.00 USD" },
]

[[tolerance]]
id = "tolerance/two-currencies-no-price"
polarity = "negative"
spec = ["beancount:beancount.core.interpolate.compute_residual"]
about = "Legs in two currencies with no price leave a residual in each."
postings = [
  { account = "Assets:Bank", units = "-10.00 USD" },
  { account = "Expenses:Food", units = "9.00 EUR" },
]

[[tolerance]]
id = "tolerance/negative-price-refused"
polarity = "negative"
spec = ["beancount:beancount.parser.grammar.Builder.posting"]
about = "A negative price is an error; Beancount uses its absolute value, so the residual itself is zero."
postings = [
  { account = "Assets:Broker", units = "10 VTI", price = "@ -100 USD" },
  { account = "Assets:Bank", units = "-1000 USD" },
]

# ---- balance: balance-assertion tolerance (get_balance_tolerance) --------------------------------------------

[[balance]]
id = "balance/exact"
polarity = "positive"
spec = ["beancount:beancount.ops.balance.check"]
about = "The balance equals the assertion."
setup = """
2020-01-01 * "deposit"
  Assets:Bank  100.00 USD
  Income:Salary  -100.00 USD
"""
account = "Assets:Bank"
amount = "100.00 USD"

[[balance]]
id = "balance/inferred-boundary"
polarity = "positive"
spec = ["beancount:beancount.ops.balance.get_balance_tolerance", "review:L3 §1.5.2"]
about = "An assertion written 100.00 tolerates twice the multiplier at its precision (0.01); a difference of exactly 0.01 passes."
setup = """
2020-01-01 * "deposit"
  Assets:Bank  100.01 USD
  Income:Salary  -100.01 USD
"""
account = "Assets:Bank"
amount = "100.00 USD"

[[balance]]
id = "balance/inferred-over"
polarity = "negative"
spec = ["beancount:beancount.ops.balance.get_balance_tolerance"]
about = "A difference of 0.05 is over the inferred 0.01."
setup = """
2020-01-01 * "deposit"
  Assets:Bank  100.05 USD
  Income:Salary  -100.05 USD
"""
account = "Assets:Bank"
amount = "100.00 USD"

[[balance]]
id = "balance/integer-zero-tolerance"
polarity = "negative"
spec = ["beancount:beancount.ops.balance.get_balance_tolerance"]
about = "An assertion written as an integer has zero tolerance."
setup = """
2020-01-01 * "deposit"
  Assets:Bank  100.004 USD
  Income:Salary  -100.004 USD
"""
account = "Assets:Bank"
amount = "100 USD"

[[balance]]
id = "balance/explicit-tolerance"
polarity = "positive"
spec = ["beancount:beancount.ops.balance.get_balance_tolerance", "ADR-0024"]
about = "An explicit ~ 0.1 replaces the inferred tolerance."
setup = """
2020-01-01 * "deposit"
  Assets:Bank  100.05 USD
  Income:Salary  -100.05 USD
"""
account = "Assets:Bank"
amount = "100.00 USD"
tolerance = "0.1"

[[balance]]
id = "balance/multiplier-option"
polarity = "positive"
spec = ["beancount:beancount.ops.balance.get_balance_tolerance", "ADR-0024"]
about = "tolerance_multiplier 0.6 makes the assertion's tolerance 2 x 0.6 x 0.01 = 0.012."
options = [["tolerance_multiplier", "0.6"]]
setup = """
2020-01-01 * "deposit"
  Assets:Bank  100.012 USD
  Income:Salary  -100.012 USD
"""
account = "Assets:Bank"
amount = "100.00 USD"

[[balance]]
id = "balance/start-of-day"
polarity = "positive"
spec = ["beancount:beancount.ops.balance.check", "beancount:beancount.core.data.entry_sortkey"]
about = "A balance assertion is checked at the start of its day: a transaction on the same date is not counted."
setup = """
2020-01-01 * "deposit"
  Assets:Bank  100.00 USD
  Income:Salary  -100.00 USD
2020-06-01 * "same day"
  Assets:Bank  5.00 USD
  Income:Salary  -5.00 USD
"""
account = "Assets:Bank"
amount = "100.00 USD"

[[balance]]
id = "balance/start-of-day-includes-fails"
polarity = "negative"
spec = ["beancount:beancount.ops.balance.check", "beancount:beancount.core.data.entry_sortkey"]
about = "Asserting the end-of-day figure on the same date fails."
setup = """
2020-01-01 * "deposit"
  Assets:Bank  100.00 USD
  Income:Salary  -100.00 USD
2020-06-01 * "same day"
  Assets:Bank  5.00 USD
  Income:Salary  -5.00 USD
"""
account = "Assets:Bank"
amount = "105.00 USD"

[[balance]]
id = "balance/parent-sums-children"
polarity = "positive"
spec = ["beancount:beancount.ops.balance.check"]
about = "An assertion on a parent account checks the sum of its sub-accounts."
setup = """
2020-01-01 * "deposit"
  Assets:Bank:Checking  60.00 USD
  Assets:Bank:Savings  40.00 USD
  Income:Salary  -100.00 USD
"""
account = "Assets:Bank"
amount = "100.00 USD"

[[balance]]
id = "balance/currency-not-allowed"
polarity = "negative"
spec = ["beancount:beancount.ops.balance.check"]
about = "An assertion in a currency the account's open line does not allow is an error."
setup = """
2000-01-01 open Assets:Bank USD
2020-01-01 * "deposit"
  Assets:Bank  100.00 USD
  Income:Salary  -100.00 USD
"""
account = "Assets:Bank"
amount = "0 EUR"

# ---- account: account-name grammar (lexer + valid_account_regexp(options), not account.is_valid) ------------

[[account]]
id = "account/default-roots"
spec = ["beancount:beancount.parser.grammar.valid_account_regexp", "beancount:beancount.parser.grammar.Builder.account", "review:L3-verif §2.4", "ADR-0024"]
about = "Default root names. The parser checks a prefix: only the root and first sub-component are constrained by the regexp; the lexer allows any non-ASCII letter. A valid name must also be the whole text: Assets:Bank USD parses with no error (USD becomes the open line's currency) but is not an account name."
names = [
  { name = "Assets:Retirement:401k", polarity = "positive" },
  { name = "Assets:Bank:Café", polarity = "positive" },
  { name = "Assets:Bank:éclair", polarity = "positive" },
  { name = "Assets:Bank:日本", polarity = "positive" },
  { name = "Assets:Bank:🏦", polarity = "positive" },
  { name = "Assets:401k", polarity = "positive" },
  { name = "Assets:Éclair", polarity = "positive" },
  { name = "Assets:B", polarity = "positive" },
  { name = "Assets:Bank-Account", polarity = "positive" },
  { name = "Equity:Opening-Balances", polarity = "positive" },
  { name = "Liabilities:CreditCard:Visa", polarity = "positive" },
  { name = "Income:Salary", polarity = "positive" },
  { name = "Expenses:食費", polarity = "negative" },
  { name = "Assets:My_Bank", polarity = "negative" },
  { name = "Assets", polarity = "negative" },
  { name = "Assets:", polarity = "negative" },
  { name = "assets:Bank", polarity = "negative" },
  { name = "Assets:bank", polarity = "negative" },
  { name = "Assets:Bank:a", polarity = "negative" },
  { name = "Assets:Bank:Café_Bar", polarity = "negative" },
  { name = "Assets:Bank Name", polarity = "negative" },
  { name = "Assets:Bank USD", polarity = "negative" },
  { name = "Assets:Ab.c", polarity = "negative" },
  { name = "Assets:Bank::X", polarity = "negative" },
  { name = "Assets:-X", polarity = "negative" },
  { name = "Activos:Banco", polarity = "negative" },
]

[[account]]
id = "account/custom-root"
spec = ["beancount:beancount.parser.grammar.valid_account_regexp", "ADR-0024", "review:L3-verif §2.4"]
about = "option name_assets Activos replaces the Assets root; the other roots keep their default names."
options = [["name_assets", "Activos"]]
names = [
  { name = "Activos:Banco", polarity = "positive" },
  { name = "Liabilities:Card", polarity = "positive" },
  { name = "Assets:Bank", polarity = "negative" },
]

[[account]]
id = "account/unicode-root"
spec = ["beancount:beancount.parser.grammar.valid_account_regexp", "ADR-0024"]
about = "A custom root may start with a non-ASCII capital."
options = [["name_assets", "Ägare"]]
names = [
  { name = "Ägare:Bank", polarity = "positive" },
]

[[account]]
id = "account/lowercase-root-option"
spec = ["beancount:beancount.parser.options.options_validate_root_account", "beancount:beancount.parser.grammar.Builder.option", "ADR-0024"]
about = "A root name must start with a capital: the option is refused and the name does not parse."
options = [["name_assets", "activos"]]
names = [
  { name = "activos:Banco", polarity = "negative" },
]

# ---- currency: currency grammar (lexer CURRENCY rule; beancount.core.amount.CURRENCY_RE) --------------------

