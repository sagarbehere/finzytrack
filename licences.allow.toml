# Licence allowlist for bundled third-party dependencies (T1 licence check, scripts/check_licences.py; ADR-0042).
# SPDX identifiers. A dependency whose licence is not listed fails CI until it is added here with a reason.
# PROVISIONAL: the owner gets legal advice before v0.4.0 on the bundle question (review:F §2 item 9; ADR-0042,
# ADR-0054). Entries marked "pending legal advice" may change.
#
# Two lists, one per kind of program (ADR-0054 decision 5):
# - the shared list below judges the main sidecar (GPLv3), the frontend and the shell;
# - [engine] judges the ledger engine, a GPL-2.0-only program because it holds Beancount.

allowed = [
  "MIT", "MIT-0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "0BSD", "Zlib", "Unlicense", "CC0-1.0",
  "PSF-2.0", "Python-2.0", "MPL-2.0", "LGPL-2.1-or-later", "LGPL-3.0-or-later",
  "GPL-2.0-only", "GPL-2.0-or-later", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0",
]

[pending_legal_advice]
"Apache-2.0" = "echarts, the openai SDK, several Rust crates; the FSF considers Apache-2.0 incompatible with GPL-2.0"
"Apache-2.0 WITH LLVM-exception" = "Rust toolchain-adjacent crates"

[engine]
# GPL-2.0-compatible licences only (the FSF's licence list): the shared list without LGPL-3.0-or-later (GPLv3-only
# compatible) and without anything pending. Apache-2.0 is not here: the FSF considers it incompatible with GPL-2.0.
allowed = [
  "MIT", "MIT-0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "0BSD", "Zlib", "Unlicense", "CC0-1.0",
  "PSF-2.0", "Python-2.0", "MPL-2.0", "LGPL-2.1-or-later",
  "GPL-2.0-only", "GPL-2.0-or-later", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0",
]

[engine.reviewed]
# ADR-0054 decision 5: Beancount's own required dependencies, an explicit reviewed list, pending legal advice.
# Each passes with a warning only while its licence is exactly the reviewed expression; a change is refused.
# Beancount 3.2.0 requires both (its METADATA: Requires-Dist regex, python-dateutil).
"regex" = "Apache-2.0 AND CNRI-Python"
"python-dateutil" = "Apache-2.0 AND BSD-3-Clause"
# beanquery 0.2.0 requires TatSu-LTS. Added by the owner's decision (ADR-0054 amendment, 2026-10-26): "Please include
# the bin query in the engine, sorting out the license issues, make that a backlog item. I don't want functionality
# to be compromised during development because of legal questions." ("bin query" = beanquery.) Its clause 4
# (an acknowledgment every redistribution must keep) is the open question; the legal review settles it (BL-0085).
"tatsu-lts" = "BSD-3-Clause-Attribution"

# Reviewed SPDX ids for packages whose reported licence is a trove-classifier name (BL-0050). One exact version
# each: an upgrade is refused until the licence is read again.
[mapping.six]
version = "1.17.0"
spdx = "MIT"
source = "six-1.17.0.dist-info/LICENSE (MIT text); METADATA License: MIT; read 2026-10-26 (S0035)"

[mapping.python-dateutil]
version = "2.9.0.post0"
spdx = "Apache-2.0 AND BSD-3-Clause"
source = "python_dateutil-2.9.0.post0.dist-info/LICENSE: Apache-2.0 for contributions after 2017-12-01, and 'the above BSD License applies to all code' (3-clause text); read 2026-10-26 (S0035)"

[mapping.beanquery]
version = "0.2.0"
spdx = "GPL-2.0-only"
source = "beanquery-0.2.0.dist-info/licenses/LICENSE (GPL version 2 text, no 'or later'); METADATA classifier GPLv2; its modules say __license__ = 'GNU GPLv2'; read 2026-10-26 (S0037)"

[mapping.tatsu-lts]
version = "5.16.0"
spdx = "BSD-3-Clause-Attribution"
source = "tatsu_lts-5.16.0.dist-info/licenses/LICENSE: the 3-clause BSD text plus clause 4 'Redistributions of any form whatsoever must retain the following acknowledgment', which is SPDX BSD-3-Clause-Attribution; METADATA classifier BSD License; read 2026-10-26 (S0037)"

# Acknowledgments a licence requires every redistribution to keep (S0037). THIRD_PARTY_NOTICES carries the text under
# the package's line. One exact version each; the text must equal the sentence the licence quotes.
[acknowledgment.tatsu-lts]
version = "5.16.0"
text = 'This product includes software developed by "Juancarlo Añez" (https://apalala.bitbucket.io).'
source = "tatsu_lts-5.16.0.dist-info/licenses/LICENSE, clause 4; read 2026-10-26 (S0037)"
